pipeline:
  name: Team1 Rollouts Canary
  identifier: team1_rollouts_canary
  orgIdentifier: gitopsdemo
  projectIdentifier: selfmanagedargo
  description: >-
    Progressive delivery of the rollouts-demo app into team1-dev through the
    TENANT's own self-managed Argo CD (agent team1_argo_agent, namespace
    team1-argo), using an Argo Rollouts canary.

    The pipeline never touches Kubernetes directly and never touches Git. It
    changes the GitOps Application's kustomize image override, syncs, and then
    drives the canary through its pause steps with GitOps Rollout steps. Every
    write reaches the cluster through the tenant's Argo CD, which is confined to
    team1-dev / team1-prod by namespaced Roles it cannot author.

    SHAPE (why it looks like this):
      Update GitOps App  - set the image, without a Git write
      GitOps Sync        - apply it; this is what STARTS the rollout
      GitOps Rollout x2  - wait for each canary pause, then resume it
      GitOps Rollout     - wait for the fully promoted rollout to be Healthy

    Read ../README.md before the first run. Two prerequisites will fail this
    pipeline in ways that look like Harness bugs: argo-rollouts not installed by
    the platform (no Rollout CRD), and the argocd-server rollout-action Role not
    applied (waits succeed, resume 403s).
  tags:
    tier: tenant
    tenant: team1
    pattern: progressive-delivery

  variables:
    - name: image_tag
      type: String
      description: >-
        Tag of docker.io/argoproj/rollouts-demo to canary. The colour tags are
        healthy and differ only visually, which is what makes the traffic split
        observable. The bad-* tags fail their readiness probe on purpose - use
        one to prove the rollback path: the first GitOps Rollout step times out
        waiting for Suspended, the stage fails, and the rollback GitOps Rollout
        aborts the canary back to the stable ReplicaSet.
      required: true
      value: <+input>.default(green).allowedValues(blue,green,yellow,orange,red,purple,bad-green,bad-blue)

  stages:
    - stage:
        name: Canary to team1-dev
        identifier: canary_team1_dev
        description: >-
          One stage, one namespace. team1-prod is a copy of this stage with the
          environment and the GitOps Application swapped - deliberately not
          templated yet, because the confinement model is what is being proven
          here, not pipeline reuse.
        type: Deployment
        spec:
          deploymentType: Kubernetes
          # Required. Without gitOpsEnabled the stage expects a manifest-based
          # Kubernetes service with an infrastructure definition, and none of
          # the GitOps steps below are offered.
          gitOpsEnabled: true
          service:
            # A GitOps service. It carries NO Release Repo manifest on purpose -
            # see "Why not Update Release Repo + Merge PR" in the README. It
            # exists so the stage has a service/env/cluster triple that matches
            # the GitOps Application, which the GitOps Rollout step requires in
            # order to resolve the application.
            #
            # Definition: ../services/team1_rollouts_demo.yaml
            serviceRef: team1_rollouts_demo
          environment:
            # Definition: ../environments/team1_dev.yaml
            environmentRef: team1_dev
            # THERE IS NO INFRASTRUCTURE DEFINITION IN A GITOPS STAGE. The third
            # element of the service/environment/cluster triple is a GitOps
            # CLUSTER, named here by identifier + agent. The UI labels this
            # selector "Infrastructure", which is why people look for an
            # infrastructureDefinition that does not exist.
            #
            # Pinned rather than deployToAll: true. deployToAll targets whatever
            # clusters happen to be attached to the environment, so attaching a
            # second one later silently widens this stage's blast radius. Naming
            # the cluster binds the stage to the RESTRICTED destination -
            # team1incluster is Harness's view of the team1-in-cluster Secret
            # written by charts/tenant-platform (namespaces: team1-dev,
            # team1-prod; clusterResources: "false"), which is WALL 2.
            deployToAll: false
            gitOpsClusters:
              - identifier: team1incluster
                agentIdentifier: team1_argo_agent
          execution:
            steps:
              - step:
                  type: UpdateGitOpsApp
                  name: Set Demo Image
                  identifier: Set_Demo_Image
                  description: >-
                    Writes the kustomize image override onto the GitOps
                    Application. This changes the Application spec, NOT Git, so
                    the pipeline needs no Git connector with push rights and
                    raises no PR into the platform monorepo.

                    Harness limit: this step may appear only ONCE per stage.
                  spec:
                    agentId: team1_argo_agent
                    applicationName: team1-rollouts-demo
                    # The branch the demo manifests live on. Set explicitly so a
                    # rerun is idempotent even if someone repointed the app.
                    targetRevision: main
                    kustomize:
                      images:
                        - argoproj/rollouts-demo:<+pipeline.variables.image_tag>
                      replicas: []
                  timeout: 5m

              - step:
                  type: GitOpsSync
                  name: Sync Rollout Manifest
                  identifier: Sync_Rollout_Manifest
                  description: >-
                    The deployment. Argo applies the new pod template to the
                    Rollout object, and the argo-rollouts controller reacts by
                    starting a canary at 25%.

                    waitTillHealthy is FALSE and that is load-bearing. The
                    Rollout parks at its first indefinite pause almost
                    immediately, which Argo CD reports as health Suspended, not
                    Healthy. A sync step told to wait for Healthy would burn its
                    whole timeout on a rollout that is behaving exactly as
                    designed, and fail before any GitOps Rollout step ran.
                    Waiting for Healthy is the LAST step's job, after promotion.

                    (The schema also ties failOnTimeout to waitTillHealthy, so
                    it is omitted here rather than set to a value that would be
                    ignored.)
                  spec:
                    applicationsList:
                      - agentId: team1_argo_agent
                        applicationName: team1-rollouts-demo
                    prune: false
                    dryRun: false
                    applyOnly: false
                    forceApply: false
                    waitTillHealthy: false
                    retry: false
                    retryStrategy: {}
                    syncOptions:
                      skipSchemaValidation: false
                      # The tenant's Argo may not create namespaces - it holds
                      # no cluster-scoped write. team1-dev is created by the
                      # platform half (charts/tenant-platform).
                      autoCreateNamespace: false
                      pruneResourcesAtLast: false
                      applyOutOfSyncOnly: false
                      replaceResources: false
                      prunePropagationPolicy: foreground
                  timeout: 10m

              - step:
                  type: GitOpsRollout
                  name: Resume First Canary Pause
                  identifier: Resume_First_Canary_Pause
                  description: >-
                    Gate 1, at 25% of traffic. Waits for the rollout to reach
                    Argo CD health Suspended with message CanaryPauseStep, then
                    issues `resume`.

                    Both halves are needed. Suspended alone would also match a
                    manually paused rollout ("Rollout is paused" /
                    "manually paused"); CanaryPauseStep is the reason Argo
                    Rollouts writes into status.message when it stops at a
                    canary step, and Argo CD's Rollout health check surfaces
                    status.message verbatim.

                    Identifiers are hardcoded rather than read from
                    <+execution.steps.Sync_Rollout_Manifest.gitops.discoveredRollouts[0].*>
                    so a run cannot fail on an empty discovery list. The
                    expression form is documented in the README.

                    This is also where a bad-* image tag fails: the canary pods
                    never become ready, the rollout never reaches a pause, this
                    step times out with failOnTimeout, and the stage rolls back.
                  spec:
                    agentIdentifier: team1_argo_agent
                    appName: team1-rollouts-demo
                    namespace: team1-dev
                    rolloutName: rollouts-demo
                    waitUntilHealthStatus:
                      healthStatus: Suspended
                      healthMessage: CanaryPauseStep
                    autoRolloutAction: resume
                    failOnTimeout: true
                  timeout: 15m

              - step:
                  type: GitOpsRollout
                  name: Resume Second Canary Pause
                  identifier: Resume_Second_Canary_Pause
                  description: >-
                    Gate 2, at 50% of traffic. Same contract as gate 1. Insert
                    verification, an Approval, or a smoke test between the two
                    gates - that is the entire reason the Rollout uses
                    indefinite `pause: {}` rather than a timed pause.
                  spec:
                    agentIdentifier: team1_argo_agent
                    appName: team1-rollouts-demo
                    namespace: team1-dev
                    rolloutName: rollouts-demo
                    waitUntilHealthStatus:
                      healthStatus: Suspended
                      healthMessage: CanaryPauseStep
                    autoRolloutAction: resume
                    failOnTimeout: true
                  timeout: 15m

              - step:
                  type: GitOpsRollout
                  name: Wait For Full Promotion
                  identifier: Wait_For_Full_Promotion
                  description: >-
                    No action, wait only. After the second resume the rollout
                    runs its last step (setWeight 100) and settles.

                    Healthy and Degraded are terminal for this step, and it
                    requires the same terminal state on two consecutive polls
                    before it acts - so a transient flap during the final scale
                    does not end the wait early. Degraded observed twice fails
                    the step, which triggers the stage rollback below.

                    Deliberately NOT `promote-full`: an action is rejected when
                    it is not available in the current state, and by this point
                    there is nothing left to promote.
                  spec:
                    agentIdentifier: team1_argo_agent
                    appName: team1-rollouts-demo
                    namespace: team1-dev
                    rolloutName: rollouts-demo
                    waitUntilHealthStatus:
                      healthStatus: Healthy
                    failOnTimeout: true
                  timeout: 15m

            rollbackSteps:
              - step:
                  type: GitOpsRollout
                  name: Abort Canary
                  identifier: Abort_Canary
                  description: >-
                    Abort scales the canary ReplicaSet back to zero and leaves
                    the stable version serving 100%. It is the right rollback
                    for a canary: the previous version never went away, so there
                    is nothing to redeploy.

                    No waitUntilHealthStatus - the action fires immediately
                    against whatever state the rollout is in.

                    Failure is IGNORED on purpose. `abort` is unavailable once
                    the rollout is fully promoted (Argo CD disables it when
                    currentPodHash == stableRS), so a stage that failed AFTER
                    promotion would otherwise fail its own rollback and mask the
                    original error. Recovering from that case means running this
                    pipeline again with the previous tag.
                  spec:
                    agentIdentifier: team1_argo_agent
                    appName: team1-rollouts-demo
                    namespace: team1-dev
                    rolloutName: rollouts-demo
                    autoRolloutAction: abort
                  timeout: 5m
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: Ignore
        tags: {}
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: StageRollback
