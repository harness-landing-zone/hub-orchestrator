# Kustomize, for exactly one reason: it gives the pipeline an image override
# channel that does not require write access to this repository.
#
# The Harness `UpdateGitOpsApp` step writes
#   spec.source.kustomize.images: ["argoproj/rollouts-demo:<tag>"]
# onto the GitOps Application, and Argo CD renders this directory with
# `kustomize build --image ...`. Nothing here is committed by the pipeline, so
# the deploy path needs no Git connector with push rights and no PR into the
# platform monorepo. The trade-off is recorded in the README under
# "Why not Update Release Repo + Merge PR".
#
# The `images:` entry below is the DEFAULT the repo declares. A pipeline run
# overrides it for the life of the Application; re-syncing without an override
# returns the app to this tag.
#
# Deliberately NO `namespace:` field. The destination namespace comes from the
# Argo Application (team1-dev), which keeps this directory reusable for
# team1-prod from a second Application. To render it by hand:
#   kubectl kustomize .            # inspect
#   kubectl apply -k . -n team1-dev
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - rollout.yaml
  - service.yaml

images:
  - name: argoproj/rollouts-demo
    newTag: blue
