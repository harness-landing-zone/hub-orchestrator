{{- include "tenant-platform.validate" . -}}
{{- /*
WALL 2 - the Argo-layer wall, sitting behind the RBAC wall.

A DECLARED in-cluster destination that replaces the implicit one. Two fields do
the work:

  namespaces:       hard allowlist. The controller's cluster cache then
                    enumerates ONLY these and never attempts a cluster-wide
                    list - observed live in the NatWest POC.
  clusterResources: "false" - never create or manage cluster-scoped resources.

The implicit in-cluster destination MUST also be disabled, or this Secret is
just an additional option rather than a replacement. That is
cluster.inClusterEnabled: "false" in the tenant's argocd-cm, set by the runtime
Application - not here, because this chart does not own the instance's config.

This Secret lives in the tenant's own namespace, so a tenant with namespace-admin
could edit it. That is fine and is exactly why WALL 1 exists: widening this list
grants nothing, because the Roles do not exist in the namespaces they would add.
Argo would simply start failing on 403s. Policy here, enforcement there.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.team }}-in-cluster
  namespace: {{ .Values.argocdNamespace | quote }}
  labels:
    argocd.argoproj.io/secret-type: cluster
    {{- include "tenant-platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  name: {{ .Values.team }}-in-cluster
  server: https://kubernetes.default.svc
  namespaces: {{ join "," .Values.workloadNamespaces | quote }}
  clusterResources: "false"
  # In-cluster: the API server is reached over the ServiceAccount token and the
  # in-cluster CA, so no credential material belongs in this Secret.
  config: |
    {"tlsClientConfig":{"insecure":false}}
