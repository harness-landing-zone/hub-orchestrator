# THE HANDOVER POINT. This is the last thing the platform files for tenant team1,
# and the only object in this repo that names the app team's repo.
#
# WHAT IT DOES: renders charts/appsets from the PUBLIC pod-info-demo repo into
# team1-argo, producing ONE ApplicationSet (podinfo-team1). That ApplicationSet -
# owned by the tenant's own Argo, not by this one - generates the actual workload
# Applications, one per environment. Nothing about the workload is decided here:
# no image, no namespace, no sync policy. The app team changes all of that in
# their own repo without a commit to this one.
#
# That is the boundary this whole tree exists to draw. hub-orchestrator
# bootstraps until the tenant's instance is alive (argo-rollouts at wave -1,
# team1-platform at 0, team1-instance at 1); from wave 2 the tenant consumes its
# own repo.
#
# ---------------------------------------------------------------------------
# WHAT REPLACED WHAT, AND WHY THE OLD SAFETY CONTRACT IS GONE
# ---------------------------------------------------------------------------
# This file used to seed a single hand-written Application that sourced
# eks-hub/rollouts-demo/app from THIS repo, and it carried an elaborate
# ignoreDifferences + RespectIgnoreDifferences contract. That existed for exactly
# one reason: the pipeline's UpdateGitOpsApp step wrote
# spec.source.kustomize.images ONTO the Application object, so a self-healing
# parent would revert the pipeline's image override within seconds - green steps,
# green sync, old image still running.
#
# The pipeline now uses GitOpsUpdateReleaseRepo, which writes image.tag into
# envs/<env>.yaml IN GIT and raises a PR. Git is the source of truth again, no
# runtime field is contested, and the entire ignoreDifferences contract is
# therefore unnecessary rather than merely relaxed. Do not reintroduce it
# alongside an UpdateReleaseRepo pipeline - it would be protecting a field
# nothing writes.
#
# It also sourced a PRIVATE repo, which is what forced a repository credential
# into the tenant and, through it, the plugin render path that broke
# team1-instance. The public repo removes that whole class.
#
# ---------------------------------------------------------------------------
# WHY selfHeal IS SAFE HERE
# ---------------------------------------------------------------------------
# This Application manages ONE object - the ApplicationSet - whose spec never
# changes at runtime. The Applications the appset generates are owned by the
# tenant's ApplicationSet controller, not by this Application, so selfHeal here
# cannot fight anything the pipeline does.
#
# prune stays OFF: pruning would delete the ApplicationSet and, with it, every
# generated Application and the running workload. Removing a tenant's app is a
# deliberate act.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: team1-podinfo-appset
  namespace: gitopsdemo-org-agent
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app.kubernetes.io/part-of: tenant-platform
    team: team1
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    # The TENANT's instance namespace - where its Argo watches for
    # ApplicationSets and Applications.
    namespace: team1-argo
  source:
    # The APP TEAM's repo. Public, so the tenant's Argo needs no credential and
    # this Application needs no plugin render - see team1-instance.yaml for what
    # a secret expression costs here.
    repoURL: https://github.com/harness-landing-zone/pod-info-demo
    targetRevision: main
    path: charts/appsets
    helm:
      releaseName: podinfo-appset
      valueFiles:
        # Relative to the chart dir; the whole repo is checked out, so ../../
        # climbs to the repo root. Same escape hatch team1-instance.yaml uses.
        - ../../applicationset/team1/values.yaml
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
    retry:
      backoff:
        duration: 1m
      limit: 20
