# TENANT BOOTSTRAP for the local-dev hub.
#
# Turns every hub-clusters/local-dev/tenants/<tenant>/values.yaml into two
# Applications:
#
#   <tenant>-platform    charts/tenant-platform                 the walls
#   <tenant>-instance    charts/harness-gitops-agent-bootstrap  the tenant's own
#                                                               namespaced Argo CD
#                                                               + Harness agent
#
# Adding a tenant is adding one file. The Harness GitOps Agent it registers is
# created AT THE SCOPE THE TENANT FILE DECLARES (harnessAgent.spec.scope:
# ACCOUNT | ORG | PROJECT) - the chart validates the scope/identity combination
# and fails the render rather than registering something half-specified. That is
# the contract the IDP request pipeline writes to; see ../tenants/README.md.
#
# ---------------------------------------------------------------------------
# THERE IS NO CLUSTER SELECTOR HERE, ON PURPOSE.
#
# The hub is already chosen twice before anything in this file runs:
#   1. values/dev-hub-agent-override.yaml points THIS hub's root ApplicationSet
#      at hub-clusters/local-dev/bootstrap, so no other hub syncs this file;
#   2. this hub's Argo only holds its OWN cluster Secret, so a clusters
#      generator could not match anything else even if we added one.
# A third gate is redundant and is the classic way to end up with an
# ApplicationSet that reports "generated successfully" and produces zero
# Applications (charts/application-sets/README.md, "Failure modes").
#
# Consequence: the destination is the in-cluster address. When a hub starts
# serving tenants on SPOKE clusters, THAT is when a matrix with a clusters
# generator plus per-cluster Secret labels is added - not before.
# ---------------------------------------------------------------------------
#
# NO metadata.namespace, ALSO ON PURPOSE. Argo applies a namespace-less manifest
# into the parent Application's destination namespace, which for the root
# Application is the agent's own release namespace (account-agent on this hub).
# That keeps this file identical across hubs apart from the tenants path,
# instead of hardcoding an agent namespace that has already drifted once.
#
# REQUIRES progressive syncs on this hub's ApplicationSet controller
# (applicationsetcontroller.enable.progressive.syncs, set by the same override).
# Without it the RollingSync strategy below is accepted and SILENTLY ignored, so
# a tenant's Argo can install before the namespaces and Roles it needs exist.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: tenants-bootstrap
spec:
  goTemplate: true
  # Deliberately NOT goTemplateOptions: missingkey=error. With it, one tenant
  # file missing a key kills generation for EVERY tenant. Without it, only that
  # tenant's own Application is rejected and the rest still onboard.
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - matrix:
        generators:
          # The two roles. Only what differs per ROLE lives here; everything
          # per TENANT comes from the values file below. Both charts are shared
          # and live at the repo root, so a hub folder holds desired state only.
          - list:
              elements:
                - role: platform
                  chartPath: charts/tenant-platform
                  releaseSuffix: platform
                - role: instance
                  chartPath: charts/harness-gitops-agent-bootstrap
                  # LOAD-BEARING - DO NOT CHANGE OR DROP. The argo-cd subchart
                  # bakes app.kubernetes.io/instance into Deployment selectors,
                  # which are immutable; renaming the release breaks the sync on
                  # an immutable field, or recreates the tenant's whole Argo.
                  releaseSuffix: argocd
          - git:
              repoURL: https://github.com/harness-landing-zone/hub-orchestrator.git
              revision: HEAD
              files:
                - path: hub-clusters/local-dev/tenants/*/values.yaml
                - path: hub-clusters/local-dev/tenants/*/*/values.yaml
  # Every tenant's platform first, then the instances. Each step waits for its
  # Applications to be HEALTHY - something sync waves cannot do between
  # ApplicationSet-generated Applications, because their parent is an
  # ApplicationSet and there is no sync operation to order them.
  strategy:
    type: RollingSync
    rollingSync:
      steps:
        - matchExpressions:
            - key: role
              operator: In
              values: [platform]
        - matchExpressions:
            - key: role
              operator: In
              values: [instance]
  template:
    metadata:
      name: '{{.team}}-{{.role}}'
      labels:
        # role is what the RollingSync steps match on. Without it the steps
        # match nothing and the ordering silently does not happen.
        role: '{{.role}}'
        team: '{{.team}}'
        app.kubernetes.io/part-of: tenant-platform
        # Harness Service / Environment linkage. Values come from the tenant
        # file's `harness:` block; Harness reads these LABELS (not annotations)
        # when the agent syncs the Application and files it under that Service,
        # which is how the platform team sees an inventory of instances. The
        # `if` guard keeps a hand-authored tenant without the block valid - an
        # empty label value is legal, the literal `<no value>` is not.
        harness.io/serviceRef: '{{ if .harness }}{{ .harness.serviceRef }}{{ end }}'
        harness.io/envRef: '{{ if .harness }}{{ .harness.envRef }}{{ end }}'
    spec:
      project: default
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{.argocdNamespace}}'
      # Multi-source so `$values` resolves from the REPO ROOT. A chart-relative
      # path would need a different ../../ depth per chart and would break
      # outright once these charts are published to a Helm/OCI registry - at
      # which point only the second source changes, from `path:` to
      # `chart:` + `targetRevision:`.
      sources:
        - repoURL: https://github.com/harness-landing-zone/hub-orchestrator.git
          targetRevision: HEAD
          ref: values
        - repoURL: https://github.com/harness-landing-zone/hub-orchestrator.git
          targetRevision: HEAD
          path: '{{.chartPath}}'
          helm:
            releaseName: '{{.team}}-{{.releaseSuffix}}'
            valueFiles:
              - '$values/{{.path.path}}/{{.path.filename}}'
      syncPolicy:
        automated:
          selfHeal: true
          # NO PRUNE (decided 2026-08-03): tenant-platform creates NAMESPACES, so
          # pruning would let a one-line values edit delete a namespace and every
          # workload in it. Removing a namespace stays a deliberate act.
          prune: false
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          backoff:
            duration: 1m
          limit: 20
