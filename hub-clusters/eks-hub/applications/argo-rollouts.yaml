# PLATFORM ADDON. Argo Rollouts - the controller and its cluster-scoped CRDs.
#
# This is the file that answers "who installs argo-rollouts". The PLATFORM does,
# through the EKS hub's own ORG-scoped agent (gitopsdemo_org_agent, namespace
# gitopsdemo-org-agent). The tenant cannot, and no amount of tenant
# configuration changes that:
#
#   1. installCRDs: true renders FIVE CustomResourceDefinitions (rollouts,
#      analysisruns, analysistemplates, clusteranalysistemplates, experiments).
#      CRDs are cluster-scoped by definition. Verified by rendering 2.41.1 with
#      clusterInstall=false AND installCRDs=true: the CRDs are still there.
#      There is no namespaced CRD.
#   2. clusterInstall: true renders cluster-scoped RBAC (see the values below -
#      with the aggregate roles off it is exactly 1 ClusterRole + 1
#      ClusterRoleBinding).
#   3. Tenant team1's Argo holds ZERO ClusterRoles, its AppProject sets
#      clusterResourceWhitelist: [], and its cluster Secret sets
#      clusterResources: "false". Three independent walls, each of which alone
#      is enough to refuse this install. That is the design working, not a bug.
#
# Kubernetes escalation prevention makes it structural rather than a policy
# choice: the tenant identity holds no cluster-scoped write, so it cannot grant
# it either. Same reason the platform half of charts/tenant-platform exists.
#
# BLAST RADIUS, STATED PLAINLY: a cluster-wide rollouts controller can write
# ReplicaSets, pods, services, ingresses and jobs and read Secrets in EVERY
# namespace on this cluster, tenant namespaces included. It is a platform
# component with platform privilege, the same category as
# kube-controller-manager or the CSI driver. It does NOT widen what the TENANT
# can do - the tenant still only ever writes Rollout objects into
# team1-dev/team1-prod, through an Argo confined there by Roles it cannot
# author. The confinement model is intact; the trusted-component list grew by
# one. The per-namespace alternative (clusterInstall: false) and what it costs
# are in ../rollouts-demo/README.md.
#
# WAVE -1, AND HERE IT IS ENFORCEMENT. These Applications share one parent -
# fleet-apps-eks-hub, generated by bootstrap/fleet-apps.yaml from a flat read of
# this directory - so they are resources of a single Application and sync waves
# DO order them against each other. -1 puts the CRDs in place, and Healthy,
# before team1-platform (0), team1-instance (1) and the demo app (2).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-rollouts
  namespace: gitopsdemo-org-agent
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/part-of: platform-addons
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: argo-rollouts
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-rollouts
    # PINNED, and this is the newest published version - verified with
    #   helm show chart argo-rollouts --repo https://argoproj.github.io/argo-helm
    #     name: argo-rollouts   version: 2.41.1   appVersion: v1.9.1
    # The chart declares no kubeVersion constraint and renders clean against
    # --kube-version 1.36.0 using only GA APIs (apiextensions.k8s.io/v1,
    # apps/v1, rbac.authorization.k8s.io/v1, v1).
    #
    # Do not float this to a range. The CRDs are cluster-scoped and shared with
    # every tenant on this cluster, so a chart bump is a cluster-wide change -
    # the same discipline section 7 of ../self-managed-argo-architecture.txt
    # applies to the Argo CD CRDs.
    targetRevision: 2.41.1
    helm:
      releaseName: argo-rollouts
      values: |
        # The controller and its CRDs. Both halves are cluster-scoped work and
        # both are why this Application lives in the platform tier.
        installCRDs: true
        # Survive a helm/Argo uninstall. Deleting a Rollout CRD deletes every
        # Rollout object on the cluster with it, across all tenants.
        keepCRDs: true
        clusterInstall: true
        # The aggregate-to-view/edit/admin ClusterRoles exist only to fold
        # rollouts into the built-in view/edit/admin ClusterRoles. This cluster
        # binds tenants through namespaced Roles authored by the platform, so
        # aggregation grants nothing here and is dead cluster-scoped RBAC.
        # Off, this render is 1 ClusterRole + 1 ClusterRoleBinding, not 4 + 1.
        createClusterAggregateRoles: false
        controller:
          # One replica. The chart defaults to 2 with leader election; this is a
          # demo/POC cluster with the node headroom concern recorded as Q4 in
          # ../self-managed-argo-architecture.txt. Raise to 2 for anything real.
          replicas: 1
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
        dashboard:
          # A second web UI with its own exposure question. Harness and the
          # tenant's Argo CD UI already show rollout state; use
          # `kubectl argo rollouts get rollout` for the rest.
          enabled: false
  syncPolicy:
    automated:
      selfHeal: true
      # No prune. Pruning here would delete the CRDs - and with them every
      # tenant's Rollout objects - on a bad render. Removing this addon is a
      # deliberate act, same reasoning as team1-instance.yaml.
      prune: false
    syncOptions:
      - CreateNamespace=true
      # Kept, but not for the reason usually cited. The folklore is that the
      # Rollout CRD blows the 262144-byte limit on
      # kubectl.kubernetes.io/last-applied-configuration; measured on THIS chart
      # version the largest CRD serialises to 69,424 bytes, because
      # argo-rollouts ships its CRDs with descriptions stripped. So a
      # client-side apply would in fact work today. SSA is kept because it
      # avoids the annotation entirely - which is what protects the next chart
      # bump if descriptions ever come back - and because every other
      # Application in this chain uses it.
      - ServerSideApply=true
    retry:
      backoff:
        duration: 1m
      limit: 10
