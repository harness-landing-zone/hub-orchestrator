# Monitoring group wrapper - runs in the EKS member's OWN Argo.
#
# WHY THIS LIVES HERE AND NOT IN THE HUB'S bootstrap/
# ---------------------------------------------------
# The local hub installs and REGISTERS agents; it does not push addons across
# the wire for the lifetime of the fleet. Each member's org-level Argo installs
# its own addons. So this file is synced TO EKS by the root Application that
# fleet-members/hub-cluster/eks-hub.yaml's rootAppSet block stamps, and every
# Application below is reconciled by EKS's own Argo against itself.
#
# It is an ApplicationSet, not a bare Application, for the same reason the hub's
# monitoring is: a second cluster in this Argo gets monitoring by being
# labelled, not by editing this file.
#
# TWO-STAGE EVALUATION - the source of every confusion with this chart:
#   stage 1  Argo renders charts/application-sets with the helm values below.
#            releaseName, mergeValues, applicationSetGroup, globalSelectors and
#            useSelectors are ALL resolved here, so they CANNOT be driven by
#            cluster metadata.
#   stage 2  the generated ApplicationSets resolve their own clusters generator
#            and their {{.metadata.annotations.*}} templates, once per matched
#            cluster Secret.
# Helm will happily render something that generates ZERO Applications at stage
# 2. Verify with `kubectl get app`, NEVER with the ApplicationSet's status -
# a selector that matches nothing still reports "generated successfully".
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: monitoring
  # The agent namespace: generated ApplicationSets must land where the
  # applicationset-controller is watching, or nothing reconciles them.
  namespace: account-gitops-agent
spec:
  goTemplate: true
  syncPolicy:
    # Deleting this file must not cascade appset -> Application -> finalizer ->
    # PVC -> TSDB. See the hub's own monitoring appset for the full chain.
    preserveResourcesOnDeletion: true
  generators:
    - clusters:
        selector:
          matchLabels:
            # The self-registration Secret created by hubCluster: in the member
            # file. NEVER leave this empty - an empty clusters selector matches
            # EVERY registered cluster.
            fleet_member: hub-cluster
  template:
    metadata:
      name: 'monitoring-{{.name}}'
    spec:
      # AppProject default, so these surface in the Harness GitOps view for
      # gitopsdemo/platformteam (the projectMappings entry in the member file).
      project: default
      destination:
        name: '{{.name}}'
        # The generated ApplicationSets are Argo objects, so they belong in the
        # agent namespace - NOT in the monitoring namespace. The workloads they
        # eventually create go to monitoring, set by the catalogue.
        namespace: account-gitops-agent
      source:
        repoURL: https://github.com/harness-landing-zone/hub-orchestrator.git
        # A helm chart rendered from a git path, not a helm repository. The
        # chart reads values/monitoring.yaml through $.Files.Get, so that
        # directory must be fetched with it - which a git path source does.
        path: charts/application-sets
        targetRevision: main
        helm:
          releaseName: monitoring
          valuesObject:
            # WHERE THE GENERATED ApplicationSets LAND. Not optional here.
            #
            # This key is NOT declared in the chart's values.yaml, and
            # application-set.yaml does `default "argocd" $namespace`. Under a
            # Harness agent the Argo namespace is the AGENT namespace and never
            # `argocd`, so leaving this unset puts every generated
            # ApplicationSet in a namespace no controller is watching - and
            # very likely one that does not exist. Nothing errors. Nothing
            # reconciles. The wrapper Application still goes Synced/Healthy,
            # because from Argo's point of view it applied the manifests it was
            # given.
            namespace: account-gitops-agent

            # Name PREFIX for generated ApplicationSets and Applications:
            #   <releaseName>-<cluster>-<component>-<version>
            # Required in practice - left empty the name template renders a
            # LEADING HYPHEN, which is not a valid Kubernetes name, so every
            # generated Application is rejected.
            releaseName: default

            # Reads values/monitoring.yaml from INSIDE the chart. The key must
            # match the FILE NAME: a name with no matching file renders NOTHING
            # AT ALL, silently. _validate.tpl turns that into a render failure.
            mergeValues:
              monitoring:
                use: true

            # Becomes the /monitoring/ segment of the valueFiles ladder path:
            #   <basepath>/<ladder rung>/<group>/<chartName>/values.yaml
            # Resolved at stage 1, so it cannot vary per cluster - which is
            # exactly why group selection is per-WRAPPER, one wrapper per group.
            applicationSetGroup: monitoring

            # Applies each component's own enable_ gate. With "false" the gate
            # is DROPPED and kube-prometheus-stack installs on every cluster
            # globalSelectors matches.
            useSelectors: "true"

            # Applied to EVERY generated ApplicationSet. Never empty: with no
            # globalSelectors the selector degrades to secret-type: cluster
            # alone, which matches every registered cluster including tenant
            # instances. _validate.tpl refuses to render without it.
            globalSelectors:
              fleet_member: hub-cluster
      syncPolicy:
        automated:
          selfHeal: true
          # prune OFF: this wrapper owns ApplicationSets whose Applications own
          # a PVC on EBS. Pruning is not how monitoring history should end.
          prune: false
        syncOptions:
          - CreateNamespace=true
