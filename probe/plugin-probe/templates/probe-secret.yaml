apiVersion: v1
kind: Secret
metadata:
  name: plugin-probe
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: plugin-probe
  {{- /* DELIBERATELY no argocd.argoproj.io/secret-type label. The
  ApplicationSet controller parses EVERY Secret carrying that label when it
  lists clusters, so a malformed one stops ALL ApplicationSet reconciliation -
  the 2026-07-17 incident. A probe must not be able to cause that. */}}
type: Opaque
stringData:
  {{- /* BLOCK SCALARS, not quoted strings. The plugin substitutes textually
  into helm's OUTPUT, and a resolved value here is a JSON blob full of double
  quotes - dropping that into a quoted scalar produces broken YAML and the
  manifest dies before we ever see the value. Inside a block scalar the same
  text is literal, so whatever comes back renders and we can read it. */}}
  {{- range $name, $expr := .Values.expressions }}
  {{ $name }}: |
    {{ $expr }}
  {{- end }}
