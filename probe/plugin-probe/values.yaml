# Static on purpose - the ApplicationSet passes nothing, so this file is the
# whole experiment. Edit here, push, hard-refresh the app.
#
# Single quotes inside getValue: an expression that is NOT substituted still
# leaves a valid line. The double-quoted form is what produced invalid JSON on
# 2026-07-17.
#
# Every expression renders into ONE Secret, so if any single one fails the whole
# manifest fails. Keep exactly one active while proving a mechanism.
expressions:
  # Created by terraform (referance-repos/harness-kube-management,
  # terraform/hub/harness_cluster_secret.tf): project scope in
  # harness_controllers/hub_orchistrator, backed by harnessSecretManager,
  # value = base64(jsonencode(<argo cluster config>)).
  #
  # This is the exact combination the fleet design depends on, so it is the one
  # that has to work. It resolves to base64 - decode it to read the config JSON.
  eksClusterConfig: "<+secrets.getValue('eks_hub_cluster_config')>"

  # PROVEN TO FAIL 2026-08-01, kept as the record of why:
  #   failed to decrypt secret <id>: unsupported encryption type AWS_SECRETS_MANAGER
  # AWS Secrets Manager is not a supported backend for plugin resolution - that
  # render path has no delegate, so no way to reach AWS. Do not re-enable
  # expecting a different answer.
  # projectAsm: "<+secrets.getValue('hub-secret')>"
