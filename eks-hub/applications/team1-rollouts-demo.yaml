# SEEDER for the tenant's demo Application. Platform tier, one level of
# indirection, and the indirection is the whole point.
#
# WHAT IT DOES: creates ONE object - the Argo CD Application
# `team1-rollouts-demo` in namespace team1-argo, read from
# ../rollouts-demo/argo/. That Application belongs to the TENANT's Argo (agent
# team1_argo_agent, AppProject team1, destination team1-in-cluster/team1-dev),
# which is what actually deploys the workload. Nothing about the workload is
# decided here.
#
# ---------------------------------------------------------------------------
# WHY NOT PUT THE APPLICATION ITSELF IN THIS DIRECTORY
# ---------------------------------------------------------------------------
# Because bootstrap/fleet-apps.yaml syncs this directory with selfHeal: true.
# The Harness pipeline's UpdateGitOpsApp step writes
# spec.source.kustomize.images ONTO the demo Application object; a self-healing
# parent reverts that within seconds and the pipeline appears to deploy nothing
# - green steps, green sync, old image still running. A flat manifest here would
# be adopted by fleet-apps and hit exactly that.
#
# So the demo Application is delivered by THIS Application instead, which
# declares the mutable fields as ignored:
#
#   ignoreDifferences        keeps the parent from ever seeing the pipeline's
#                            write as drift, so selfHeal never fires on it
#   RespectIgnoreDifferences makes a sync that runs for some OTHER reason (a
#                            genuine git change) leave those fields alone rather
#                            than re-applying the git value over them
#
# Both are required. ignoreDifferences alone stops the revert-on-drift path and
# not the revert-on-sync path.
#
# fleet-apps still selfHeals THIS object, which is correct - its spec never
# changes at runtime.
#
# ---------------------------------------------------------------------------
# WAVE 2 - after the tenant's Argo exists
# ---------------------------------------------------------------------------
# argo-rollouts (-1) -> team1-platform (0) -> team1-instance (1) -> here.
# The Application object could be created earlier and would simply sit there,
# but nothing would reconcile it: the AppProject it names comes from wave 0 and
# the runtime that watches team1-argo comes from wave 1. Filing it before its
# AppProject exists is an admission rejection, not a wait.
#
# ---------------------------------------------------------------------------
# ONE PREREQUISITE THIS FILE CANNOT SATISFY
# ---------------------------------------------------------------------------
# The demo Application sources this repo, which is PRIVATE. It is listed in
# AppProject sourceRepos (../tenants/team1/values.yaml) so admission passes, but
# the TENANT's Argo needs a read credential for it before the app can sync.
# Reusing the platform bootstrap-repo credential hands the tenant the whole
# monorepo - risk R3 in ../self-managed-argo-architecture.txt. That decision is
# deliberately not made here.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: team1-rollouts-demo-seed
  namespace: gitopsdemo-org-agent
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app.kubernetes.io/part-of: tenant-platform
    team: team1
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    # The TENANT's instance namespace - where its Argo watches for Applications.
    namespace: team1-argo
  source:
    repoURL: https://github.com/harness-landing-zone/hub-orchestrator.git
    targetRevision: HEAD
    path: eks-hub/rollouts-demo/argo
    directory:
      recurse: false
      # Explicit, so dropping a second file in that folder cannot silently
      # become a second Application in the tenant's namespace.
      include: team1-rollouts-demo-application.yaml
  # The fields the Harness pipeline owns at runtime. Everything else about the
  # demo Application stays declaratively managed from git.
  #   kustomize        UpdateGitOpsApp writes spec.source.kustomize.images
  #   targetRevision   the same step sets it explicitly on every run
  ignoreDifferences:
    - group: argoproj.io
      kind: Application
      name: team1-rollouts-demo
      namespace: team1-argo
      jsonPointers:
        - /spec/source/kustomize
        - /spec/source/targetRevision
  syncPolicy:
    automated:
      # Safe BECAUSE of ignoreDifferences above - it restores a deleted or
      # hand-edited Application without touching the pipeline's image override.
      selfHeal: true
      # No prune. Deleting this Application would delete the tenant's demo
      # Application and with it the running workload.
      prune: false
    syncOptions:
      # The half of the pipeline-safety contract that applies at SYNC time.
      - RespectIgnoreDifferences=true
      # Deliberately NO ServerSideApply here, unlike the rest of the chain. SSA
      # would make this Argo the field manager for spec.source.kustomize and put
      # it in a shared-field tug-of-war with Harness over the one field we have
      # just declared we do not own. The object is a few hundred bytes, so none
      # of the SSA size arguments apply.
      - CreateNamespace=false
    retry:
      backoff:
        duration: 1m
      limit: 20
