# INSTANCE half of tenant team1 - the namespaced Argo CD plus the Harness agent
# that wraps it. Synced by the EKS hub's OWN Argo (the platform tier).
#
# REUSES charts/harness-gitops-agent-bootstrap, the same chart the platform tier
# runs. Nothing bespoke: three values in tenants/team1/values.yaml turn it into a
# namespaced install -
#   gitopsAgent.harness.createClusterRoles: false   -> 0 ClusterRoles
#   gitopsAgent.argo-cd.crds.install:      false    -> platform owns the CRDs
#   configs.cm.cluster.inClusterEnabled:  "false"   -> implicit destination off
#
# PLAIN HELM, NOT THE PLUGIN. This tenant needs no secret expression: the API key
# already exists in hga-system (apiKeySecret.create: false) and the app team's
# workload repo is public, so harnessAgent.gitSecret is gone from the values file.
# Nothing in the rendered output contains <+secrets.getValue(...)> - verified by
# rendering this chart with those values - so there is no CMP in the path and
# therefore no first-generation warm-up to absorb, unlike bootstrap/fleet-agent.yaml.
#
# IT WAS BRIEFLY PLUGIN-RENDERED, and that is the whole reason this note exists.
# A gitSecret carrying a GitHub App key for the PRIVATE monorepo forced a plugin
# source, because ONLY the ArgoCD Harness Plugin resolves those expressions. The
# EKS hub's CMP sidecar has neither helm nor argocd-harness-plugin on PATH, so
# manifest generation failed outright with exit status 127 and this Application
# never synced once. That is why team1_argo_agent was never registered and why
# gitopsdemo/selfmanagedargo stayed completely empty - no agent, no clusters, no
# services. One unrenderable Application, four missing layers downstream.
#
# Moving the workload to a public repo removes the credential, and with it the
# only reason to be on a plugin source at all. KEEP IT THAT WAY: the moment any
# value here needs <+secrets.getValue(...)>, this Application must move back to a
# plugin source and inherits the warm-up trap - first generation fails with
# STATUS_CODE=500 "failed to render expressions", and syncPolicy.retry does NOT
# cover it, because retry governs sync operations while the warm-up fails during
# COMPARISON.
#
# Wave 1: team1-platform (wave 0) must have created team1-argo and the workload
# namespaces first. The Roles it lays down in team1-dev/team1-prod are what this
# instance's controller will use; without them it installs fine and then fails
# every sync with Forbidden, which is the intended shape of the wall.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: team1-instance
  namespace: gitopsdemo-org-agent
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/part-of: tenant-platform
    team: team1
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: team1-argo
  source:
    repoURL: https://github.com/harness-landing-zone/hub-orchestrator.git
    targetRevision: HEAD
    path: charts/harness-gitops-agent-bootstrap
    helm:
      releaseName: team1-argocd
      valueFiles:
        # Relative to the chart dir; the whole repo is checked out, so ../../
        # climbs to the repo root. Same file the wave-0 team1-platform
        # Application reads (as ../../tenants/team1/values.yaml from its own
        # chart dir) - one file, two charts, neither reading the other's keys.
        - ../../eks-hub/tenants/team1/values.yaml
  syncPolicy:
    automated:
      selfHeal: true
      # No prune. The HarnessGitopsAgent CR carries a finalizer that deregisters
      # the agent in Harness - losing the CR without the API key Secret strands
      # a registered agent. Removing a tenant is a deliberate act.
      prune: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      backoff:
        duration: 1m
      limit: 20
