# TENANT BOOTSTRAP - every tenant's platform + Argo instance, from one file.
#
# Replaces the per-tenant pair (team1-platform.yaml, team1-instance.yaml).
# Adding a tenant is now ONE file: eks-hub/tenants/<name>/values.yaml. At three
# tenants the old shape was six hand-written Applications differing only in a
# name.
#
# Same mechanism as fleet-members-registration - a git generator over per-entity
# values files - applied to tenants instead of clusters. That consistency is
# deliberate; it is the pattern this repo already uses to describe a fleet.
#
# ---------------------------------------------------------------------------
# WHY ONE ApplicationSet AND NOT TWO
#
# The two roles MUST be ordered: platform creates the namespaces, AppProject,
# RBAC and cluster Secret that the tenant's Argo instance then installs into.
# The old files did that with sync waves (platform 0, instance 1), which worked
# only because both were resources of ONE parent Application (fleet-apps-eks-hub).
#
# Sync waves are INERT between ApplicationSet-generated Applications - their
# parent is an ApplicationSet, not an Application, so there is no sync operation
# to order them. The ApplicationSet equivalent is `strategy: RollingSync`, and
# it only orders Applications generated by the SAME ApplicationSet. Hence one
# appset with a role matrix rather than one appset per role.
#
# RollingSync is STRONGER than the waves it replaces: each step waits for its
# Applications to become HEALTHY before the next starts, not merely applied.
#
# REQUIRES progressive syncs, enabled on this cluster via
# applicationsetcontroller.enable.progressive.syncs (see the member file). With
# that flag off, the strategy block below is accepted into the manifest and
# SILENTLY IGNORED - no error, no ordering, no warning.
# ---------------------------------------------------------------------------
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: tenants-bootstrap
  namespace: gitopsdemo-org-agent
spec:
  goTemplate: true
  # Deliberately NOT setting goTemplateOptions: missingkey=error. With it, one
  # tenant file missing a key kills generation for EVERY tenant. Without it,
  # that tenant renders a broken value and its Application is rejected at
  # validation while the others generate normally. Contained beats loud here -
  # one malformed tenant must not block onboarding the rest.
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - matrix:
        generators:
          # The two roles. Everything that differs per ROLE lives here; anything
          # that differs per TENANT comes from the values file below.
          - list:
              elements:
                - role: platform
                  chartPath: eks-hub/charts/tenant-platform
                  # Relative to the CHART directory, which is why the two roles
                  # differ: tenant-platform sits two levels under the repo root
                  # inside eks-hub/, the bootstrap chart sits directly under
                  # charts/. Both resolve to eks-hub/tenants/<team>/values.yaml.
                  valuesPrefix: ../../tenants
                - role: instance
                  chartPath: charts/harness-gitops-agent-bootstrap
                  valuesPrefix: ../../eks-hub/tenants
          # One element per tenant. The file's top-level keys (team,
          # argocdNamespace, ...) become template parameters directly, so the
          # values file stays the single source of truth for a tenant - no
          # deriving names from directory paths by convention.
          - git:
              repoURL: https://github.com/harness-landing-zone/hub-orchestrator.git
              revision: HEAD
              files:
                - path: eks-hub/tenants/*/values.yaml
  # ---- ORDERING -----------------------------------------------------------
  # Step 1 brings up every tenant's platform and waits for all of them to be
  # Healthy; step 2 then installs the Argo instances.
  #
  # Granularity is per STEP, not per tenant: it is "all platforms, then all
  # instances", not tenant-by-tenant. For this dependency that is the right
  # coarseness - an instance only needs ITS OWN platform, and waiting for all
  # of them costs nothing at this scale. Revisit if tenant counts grow enough
  # that one slow platform blocks everyone's instance.
  strategy:
    type: RollingSync
    rollingSync:
      steps:
        - matchExpressions:
            - key: role
              operator: In
              values: [platform]
        - matchExpressions:
            - key: role
              operator: In
              values: [instance]
  template:
    metadata:
      # SAME NAMES the hand-written files used (team1-platform, team1-instance).
      # That is what makes the cutover seamless: fleet-apps carries no prune, so
      # deleting those files leaves the Applications running, and this appset
      # adopts them by name rather than recreating them.
      name: '{{.team}}-{{.role}}'
      labels:
        # role is what the RollingSync steps above match on. Without it the
        # steps match nothing and ordering silently does not happen.
        role: '{{.role}}'
        team: '{{.team}}'
        app.kubernetes.io/part-of: tenant-platform
    spec:
      project: default
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{.argocdNamespace}}'
      source:
        repoURL: https://github.com/harness-landing-zone/hub-orchestrator.git
        targetRevision: HEAD
        path: '{{.chartPath}}'
        helm:
          valueFiles:
            - '{{.valuesPrefix}}/{{.team}}/values.yaml'
      syncPolicy:
        automated:
          selfHeal: true
          # ---- DECIDED (Markos, 2026-08-03): NO PRUNE ---------------------
          # team1-platform.yaml previously ran prune: TRUE. False here for both
          # roles is a deliberate, agreed change - not an oversight, and not a
          # limitation worked around.
          #
          # `prune` is typed boolean in the ApplicationSet CRD, so it cannot be
          # templated per role - a string would be rejected at admission. The
          # choice was: keep per-role prune via templatePatch (complexity this
          # repo has explicitly ruled out), or standardise.
          #
          # Standardising on FALSE is also the safer direction. tenant-platform
          # creates NAMESPACES; with prune true, removing an entry from
          # workloadNamespaces deletes that namespace and every workload in it.
          # That is a very large hammer attached to a one-line values edit, and
          # it is the same reasoning behind the fleet-wide prune: false
          # convention used by fleet-apps and the addon catalogues.
          #
          # Cost: removing a tenant's namespace from values no longer cleans it
          # up. Deleting a namespace becomes a deliberate act.
          prune: false
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          backoff:
            duration: 1m
          limit: 20
