# Tenant: team1
#
# ONE file describes the whole tenant, consumed by TWO charts that ignore each
# other's keys - the same pattern as fleet-members/hub-cluster/eks-hub.yaml:
#
#   charts/tenant-platform            the CONFINEMENT half (platform-applied)
#   charts/harness-gitops-agent-bootstrap   the INSTANCE half (namespaced Argo
#                                           + Harness agent)
#
# Onboarding a workload namespace later is one line in workloadNamespaces: it
# extends the Roles AND the cluster Secret allowlist together, so they cannot
# drift apart.

# ---------------------------------------------------------------------------
# charts/tenant-platform  -  the walls
# ---------------------------------------------------------------------------
team: team1

# The instance namespace. Deliberately absent from workloadNamespaces below -
# the platform owns the instance, and making it a deploy target would hand the
# tenant write access to its own Argo CD's config and RBAC. The chart hard-fails
# if it appears in both.
argocdNamespace: team1-argo

workloadNamespaces:
  - team1-dev
  - team1-prod

# The Argo AppProject mapped to Harness gitopsdemo/selfmanagedargo below.
projectName: team1

# The first entry is a public demo repo, deliberately: it needs no credential, so
# the first proof of the lock had nothing to do with secret plumbing. The second
# one does, and the credential for it is harnessAgent.gitSecret below.
#
# ADMISSION AND ACCESS ARE TWO DIFFERENT GATES, and this list is only the first.
# sourceRepos is checked when an Application is CREATED; a repo missing from it
# is rejected on admission and the failure reads like a broken repo rather than a
# policy decision. Passing that gate still fetches nothing without a repository
# Secret - see harnessAgent.gitSecret.
sourceRepos:
  - https://github.com/argoproj/argocd-example-apps.git
  # This repo, for eks-hub/rollouts-demo/app ONLY - the source of the
  # team1-rollouts-demo Application seeded by ../../applications/.
  #
  # DECIDED (was an open decision): the tenant gets a repository Secret for this
  # repo, carrying the same GitHub App credential the member bootstrap uses, and
  # scoped to AppProject team1. It is a POC monorepo, so the read access that
  # grants - risk R3 in ../../self-managed-argo-architecture.txt - is accepted
  # rather than designed around. See harnessAgent.gitSecret for what is and is
  # not narrowed by that scoping.
  - https://github.com/harness-landing-zone/hub-orchestrator.git

# Pod Security Admission - the dimension RBAC does not cover. RBAC bounds what
# the controller may CREATE; PSA bounds what the resulting pods may DO.
namespaceLabels:
  pod-security.kubernetes.io/enforce: baseline
  pod-security.kubernetes.io/audit: restricted
  pod-security.kubernetes.io/warn: restricted

# Second dial, off. The namespace is already the wall. Turning this on REQUIRES
# setting resource.inclusions to the same list - see charts/tenant-platform.
deployableKinds:
  enabled: false
  rules: []

# ON for this tenant - team1 runs the Argo Rollouts canary demo, and the Harness
# GitOps Rollout step's actions (resume/abort) are executed by argocd-server,
# which the base Role leaves read-only. Adds patch on argoproj.io rollouts
# (+ /status) in team1-dev and team1-prod, nowhere else.
#
# Requires the platform addon in ../../applications/argo-rollouts.yaml - the CRDs
# are cluster-scoped and this tenant cannot install them.
#
# If deployableKinds is ever switched on, its rules MUST include
# argoproj.io/rollouts; the chart hard-fails the render otherwise.
rolloutActions:
  enabled: true

lockDefaultProject: true

# ---------------------------------------------------------------------------
# charts/harness-gitops-agent-bootstrap  -  the instance
# ---------------------------------------------------------------------------
harnessAgent:
  enabled: true
  metadata:
    name: team1-argo-agent
  spec:
    name: team1-argo-agent
    # PROJECT scope is what makes this the TENANT's agent rather than another
    # platform one. projectIdentifier is required at this scope.
    scope: PROJECT
    orgId: gitopsdemo
    projectId: selfmanagedargo
    # Reuses the key the platform already placed in hga-system (keep: true) for
    # the member bootstrap. The controller resolves it from
    # --api-key-secret-namespace, NOT from the CR's namespace, so nothing needs
    # to exist in team1-argo.
    #
    # NOTE this is an ORG-admin key. Safe here ONLY because the PLATFORM files
    # this CR. If tenants are ever allowed to create their own
    # HarnessGitopsAgent CRs, this becomes a per-tenant scoped key or the model
    # breaks - see R2 in ../../self-managed-argo-architecture.txt.
    apiKeySecretRef: gitopsdemo-api-key
    # MUST equal gitopsAgent.agent.existingSecrets.agentToken below - the chart
    # hard-fails otherwise. Out of step and gitops-helm creates its own Secret
    # from a blank default: the agent runs with an empty token, never connects,
    # and reports failure for entirely the wrong reason.
    tokenSecretRef: team1-argo-agent-token
  apiKeySecret:
    # The platform's key already exists in hga-system. Creating a second copy
    # here would put an org-admin credential inside the tenant's namespace,
    # which is exactly what this model is trying to avoid.
    create: false
  # Registers the monorepo as a repository in the TENANT's own Argo CD, so the
  # team1-rollouts-demo Application can actually fetch eks-hub/rollouts-demo/app.
  # Same chart template and same GitHub App credential as the member bootstrap in
  # ../../../fleet-members/hub-cluster/eks-hub.yaml - read that file first, the
  # reasoning below is the delta, not a restatement.
  #
  # THE DECISION THIS CLOSES. sourceRepos above lists this repo so admission
  # passes; a repository Secret is what supplies ACCESS. Granting it means the
  # tenant's Argo can read the whole hub-orchestrator monorepo - that is risk R3
  # in ../../self-managed-argo-architecture.txt, accepted deliberately because
  # this is a POC monorepo. It is not narrowed by anything below; the scoping
  # here bounds WHICH Applications may use the credential, not what the
  # credential can read. Move the demo manifests to their own repo and R3 goes
  # away with them.
  #
  # THREE DELIBERATE DIFFERENCES FROM THE MEMBER BOOTSTRAP:
  #
  #   project: team1   The member registers at project: default. Here the
  #                    repository is scoped to the TENANT's AppProject, so only
  #                    Applications in team1 can use it - a second AppProject on
  #                    this instance would not inherit the credential. It also
  #                    makes the Harness agent file the Repository entity under
  #                    the project mapped to AppProject team1
  #                    (gitopsdemo/selfmanagedargo) rather than at org scope.
  #
  #   credsTemplate    OFF, and that is the half that matters. A repo-creds
  #                    Secret is GLOBAL - never project-scoped - so rendering one
  #                    would hand the same credential to every AppProject on this
  #                    instance and undo the line above. The member needs it
  #                    because its ApplicationSet git generators resolve
  #                    credentials outside any AppProject; this tenant runs no
  #                    ApplicationSet (rootAppSet is off), so it needs nothing.
  #
  #   name/repoName    Explicit. "bootstrap-repo" would be a lie in this
  #                    namespace: nothing here bootstraps from it, it is a
  #                    workload source. The Secret name is free-form (Argo
  #                    matches on the label) and repoName is only the display
  #                    name in the Argo and Harness UIs.
  #
  # The two ids are literals ON PURPOSE - they are not credentials (both appear
  # in the GitHub App's own URL) and they land in stringData, which has no base64
  # guard, so an unresolved expression there would be written verbatim and
  # surface as an opaque GitHub auth failure. Only the key is secret, and it
  # lands in data: where an unresolved expression is rejected outright. That is
  # what makes the expression below fail LOUDLY if it does not resolve.
  gitSecret:
    create: true
    name: hub-orchestrator-repo
    repoName: hub-orchestrator
    url: https://github.com/harness-landing-zone/hub-orchestrator.git
    project: team1
    credsTemplate: false
    # QUOTED - an unquoted 7+ digit number renders in scientific notation and
    # silently produces a wrong credential. The chart hard-fails on non-strings.
    githubAppID: "2780955"
    githubAppInstallationID: "107783082"
    # Resolved by the ArgoCD Harness Plugin at manifest generation, which is why
    # ../../applications/team1-instance.yaml had to move from a helm source to a
    # plugin source. NOT githubAppJson: the plugin substitutes into helm's
    # OUTPUT, so at template time the chart would still see the literal
    # expression and fromJson would die with "not valid JSON".
    #
    # ACCOUNT-QUALIFIED, unlike the member file. That one is rendered by the
    # hub's ACCOUNT-scoped agent, where the bare identifier resolves. This file
    # is rendered by the EKS hub's ORG-scoped agent (gitopsdemo_org_agent), and
    # a bare identifier there resolves against org gitopsdemo. Verify the
    # secret's real scope before the first sync and drop the prefix if it is an
    # org secret - the failure is loud (base64 decode error on the Secret), not
    # silent.
    githubAppPrivateKeyB64: "<+secrets.getValue('account.github_app_private_key_b64')>"

gitopsAgent:
  enabled: true
  # Same pin as the platform agent, for the same reason: gitops-helm 1.2.7
  # defaults to Argo v2.14.9, whose schema predates .status.terminatingReplicas
  # (Kubernetes 1.33+), and this cluster is 1.36. Left at the default, this
  # tenant instance comes up fine and then fails COMPARISON on every workload it
  # deploys into team1-dev / team1-prod.
  #
  # Keep this in step with fleet-members/hub-cluster/eks-hub.yaml. Both Argos on
  # this cluster share one set of cluster-scoped CRDs, so letting them drift is
  # how the tenant ends up reconciling against CRDs it does not agree with.
  global:
    image:
      tag: v3.3.10
  harness:
    # THE namespaced switch. false drops the three '*'/'*' cluster-admin
    # ClusterRoles (application-controller, repo-server, gitops-agent). The
    # bundled argo-cd subchart still renders its namespaced Roles, so the
    # instance is complete - verified: 6 Roles + 6 RoleBindings, 0 ClusterRoles.
    createClusterRoles: false
    gitopsServerHost: https://app.harness.io/prod1/gitops
    identity:
      accountIdentifier: qIYsos1ZQO6fJMG1Ip6KJA
      orgIdentifier: gitopsdemo
      # Required at PROJECT scope, and must match spec.projectId above.
      projectIdentifier: selfmanagedargo
      agentIdentifier: team1_argo_agent
  agent:
    harnessName: team1-argo-agent
    existingSecrets:
      agentToken: team1-argo-agent-token
  argo-cd:
    crds:
      # The platform bundle owns the CRDs - they are cluster-scoped and shared
      # with the platform instance. A tenant-driven CRD change would hit the
      # platform too.
      install: false
      keep: true
    configs:
      cm:
        # Disable the IMPLICIT in-cluster destination. Without this the
        # restricted cluster Secret from tenant-platform is merely an extra
        # option rather than a replacement, and the tenant could target the
        # unrestricted built-in destination instead.
        cluster.inClusterEnabled: "false"

# Maps the tenant's Argo AppProject to their Harness project, so Applications
# filed under it appear in that project's GitOps view.
projectMappings:
  - name: team1-selfmanaged
    appProject: team1
    orgId: gitopsdemo
    projectId: selfmanagedargo
    autoCreateServiceEnv: false

# Deliberately OFF. That template still carries helm.sh/hook with
# hook-delete-policy: before-hook-creation (BUGS B15), and Argo translates helm
# hooks into sync hooks - so the AppProject would be DELETED AND RECREATED on
# every sync, and Applications filed under it cannot be validated during the
# gap. charts/tenant-platform provides both AppProjects as ordinary resources.
appProject:
  enabled: false
