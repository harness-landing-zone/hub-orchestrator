# Addons group wrapper - runs in the EKS member's OWN Argo.
#
# Second wrapper alongside monitoring.yaml, and that separation is REQUIRED by
# the chart, not a preference: mergeValues and applicationSetGroup resolve at
# helm render (stage 1), so one wrapper can only ever serve one group.
#
# The two wrappers are independent in every way that matters - separate
# catalogues, separate ladder folders, separate sync lifecycles. A failure in
# one group's render does not stop the other from generating.
#
# THE LIMIT OF THAT INDEPENDENCE, since it has been mis-stated before: group
# wrappers do NOT isolate stage-2 failures. Removing a label that the shared
# valueFiles ladder references (tenant, environment) breaks generation for
# EVERY group at once, because the failing template is in the ladder both
# groups render. Already-generated Applications survive, and it self-heals when
# the label returns.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addons
  namespace: gitopsdemo-org-agent
spec:
  goTemplate: true
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - clusters:
        selector:
          matchLabels:
            fleet_member: hub-cluster
  template:
    metadata:
      name: 'addons-{{.name}}'
    spec:
      project: default
      destination:
        name: '{{.name}}'
        namespace: gitopsdemo-org-agent
      source:
        repoURL: https://github.com/harness-landing-zone/hub-orchestrator.git
        path: charts/application-sets
        targetRevision: main
        helm:
          releaseName: addons
          valuesObject:
            # Not optional. The key is undeclared in the chart's values.yaml and
            # defaults to "argocd", which is never the Argo namespace under a
            # Harness agent - generated ApplicationSets would land where no
            # controller watches, silently, with this wrapper still
            # Synced/Healthy. See BUGS B20.
            namespace: gitopsdemo-org-agent

            # Name prefix for generated ApplicationSets and Applications.
            # Required in practice: empty renders a LEADING HYPHEN, which is not
            # a valid Kubernetes name, so every Application is rejected.
            releaseName: default

            # Reads values/addons.yaml from INSIDE the chart. The key must match
            # the FILE NAME - a name with no matching file renders NOTHING AT
            # ALL, silently. _validate.tpl turns that into a render failure.
            mergeValues:
              addons:
                use: true

            # Becomes the group segment of the ladder path:
            #   <basepath>/<rung>/addons/<chartName>/values.yaml
            applicationSetGroup: addons

            # Applies each component's enable_ gate. With "false" the gate is
            # dropped and every addon installs on every matched cluster.
            useSelectors: "true"

            # Never empty: with no globalSelectors the selector degrades to
            # secret-type: cluster alone, which matches every registered
            # cluster including tenant instances.
            globalSelectors:
              fleet_member: hub-cluster
      syncPolicy:
        automated:
          selfHeal: true
          prune: false
        syncOptions:
          - CreateNamespace=true
