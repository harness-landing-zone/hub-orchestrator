# ONE Service, and that is the whole traffic-management story.
#
# Its selector is the Rollout's pod-template label, so it selects the stable AND
# the canary ReplicaSet at the same time. kube-proxy then load-balances across
# whatever pods exist, which means `setWeight: 25` with 4 replicas puts ~25% of
# requests on the new version. That is basic (replica-based) canary: no ingress
# controller, no service mesh, no second Service whose selector has to be
# patched - and therefore no cluster-scoped anything.
#
# If you ever add trafficRouting, you also add stableService/canaryService and
# the rollouts controller starts PATCHING Service selectors. That needs
# services:patch in this namespace, which it already has from the chart's
# namespaced Role - but the ingress/mesh it routes through does not exist and
# cannot be installed by the tenant. Do not go there without the platform.
#
# ClusterIP on purpose. A LoadBalancer here would provision a real AWS NLB from
# a demo namespace; port-forward instead:
#   kubectl -n team1-dev port-forward svc/rollouts-demo 8080:80
apiVersion: v1
kind: Service
metadata:
  name: rollouts-demo
  labels:
    app.kubernetes.io/name: rollouts-demo
    app.kubernetes.io/part-of: team1-rollouts-demo
    team: team1
spec:
  type: ClusterIP
  selector:
    app: rollouts-demo
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
