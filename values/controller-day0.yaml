# Day-0 controller values for the permanent bootstrap-0 hub.
# Consumed by service hub_controller in harness_controllers/hub_orchistrator.
# Written for controller chart 0.8.0 (image v0.5.0): two CRDs, one manager.
#
# Harness resolves expressions in this file before Helm renders the chart. Keep
# Harness expression syntax out of comments — fetched values-file comments are
# evaluated too.

image:
  repository: <+artifacts.primary.imagePath>
  tag: <+artifacts.primary.tag>

# 0.5.0 templates the CRD instead of shipping it in crds/. That matters: Helm
# NEVER upgrades anything in a crds/ directory, so on 0.4.0 a CRD schema change
# meant a manual kubectl apply on every cluster forever. Here it ships with the
# chart. keep:true annotates it so a helm uninstall leaves existing agent CRs
# intact rather than cascading their deletion.
crds:
  enabled: true
  keep: true

manager:
  # The controller manages Agent and Mapping CRs ONLY in these namespaces and
  # reads each API-key Secret from the CR's own namespace. hga-system holds no
  # Harness key. Onboarding an instance namespace means adding it here and
  # redeploying the controller; a CR anywhere else reports NamespaceNotAllowed
  # and never reaches Harness.
  managedNamespaces:
    - hub-account-agent
    - account-agent
    - gitopsdemo-org-agent
    - team1-argo
    - bddpoc-argo
  # Harness API gateway, pinned so the pod environment cannot redirect it.
  harnessEndpoint: https://app.harness.io/gateway

  # JSON logs rather than controller-runtime's development mode.
  zapDevelopment: false

  # Metrics ON from day zero. The chart exposes the container port only when
  # bindAddress is not "0", so leaving the default would mean a controller
  # restart later purely to make it scrapeable.
  #
  # secure:false serves plain HTTP on 8080 and skips controller-runtime's
  # authn/authz filter, which would otherwise need certificates wired through
  # metrics-cert-path. Anything in the cluster can read these metrics — an
  # acceptable trade inside a private cluster, and the reason this is not a
  # pattern to copy onto a shared one.
  #
  # Chart 0.6.0 added a metrics Service and an opt-in ServiceMonitor, so the
  # PodMonitor this comment used to call for is no longer needed - and was never
  # actually created.
  metrics:
    bindAddress: ":8080"
    port: 8080
    secure: false
    serviceMonitor:
      # THE POINT OF ALL OF THIS. Without a scrape of :8080, Prometheus sees the
      # controller only through cAdvisor - container CPU and memory - and a
      # reconciler stuck in a MappingMismatch retry loop looks IDENTICAL to a
      # healthy one on those. This turns on the signals that tell them apart:
      #   controller_runtime_reconcile_errors_total
      #   controller_runtime_reconcile_time_seconds
      #   workqueue_depth / workqueue_adds_total
      # which is what makes a Harness CV Verify step able to judge a controller
      # deployment on whether it RECONCILES, not merely whether it starts.
      enabled: true
      # No additionalLabels needed: this hub's kube-prometheus-stack runs with
      # serviceMonitorSelectorNilUsesHelmValues=false, so it selects any
      # ServiceMonitor rather than only those labelled with its release name.
      interval: 30s
