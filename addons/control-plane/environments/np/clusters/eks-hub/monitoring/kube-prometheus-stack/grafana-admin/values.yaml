# Ladder rung 3 - the Grafana admin credential for the eks-hub cluster.
#
# Resolved path:
#   $values/addons/control-plane/environments/np/clusters/eks-hub/
#           monitoring/kube-prometheus-stack/grafana-admin/values.yaml
#                      ^chartName            ^additionalResources.type
#
# CLUSTER RUNG, not a defaults rung: remoteKey names one specific cluster. Two
# clusters sharing a remoteKey would share a Grafana password, and the second to
# start would silently read the first's.

secretStore:
  # Not created here - external-secrets owns the ClusterSecretStore. This only
  # says which store to REFERENCE.
  enabled: false
  kind: ClusterSecretStore
  name: aws-secrets-manager

externalSecrets:
  grafana-admin:
    enabled: true
    namespace: monitoring
    # What grafana.admin.existingSecret points at, in this rung's sibling
    # kube-prometheus-stack/values.yaml.
    targetName: grafana-admin
    # ---- THE CLUSTER NAME HERE IS THE **AWS** ONE ------------------------
    # 'hub-cluster', not 'eks-hub'. Two names for the same cluster:
    #   eks-hub      - how Argo knows it (hubCluster.name, and this folder)
    #   hub-cluster  - the EKS cluster name, which terraform builds the IAM
    #                  scope from: …:secret:<cluster>/*
    # Use the Argo name and every fetch fails AccessDenied, with nothing in the
    # error mentioning names or paths.
    #
    # PRE-EXISTING - this chart only READS. Creating the entry belongs to
    # whatever owns the AWS account: the cluster's terraform lifecycle, or ACK
    # if secret provisioning moves in-cluster later. See charts/addon-secrets
    # values.yaml for why that boundary is drawn there.
    #
    # A NEW CLUSTER NEEDS THIS SECRET TO EXIST BEFORE MONITORING GOES HEALTHY.
    # Grafana will not start without it, and the failure looks like a Grafana
    # problem rather than a missing credential.
    remoteKey: "hub-cluster/grafana/admin"
    data:
      - secretKey: admin-password
        property: admin-password
    literals:
      # Grafana needs admin-user in the SAME Secret as admin-password.
      admin-user: admin
