pipeline:
  name: Hub Bootstrap CD
  identifier: hub_bootstrap_cd
  orgIdentifier: harness_controllers
  projectIdentifier: hub_orchistrator
  description: |-
    Day-0 install of the HGA controller and the ACCOUNT-scoped GitOps Agent on a permanent bootstrap cluster. Everything beyond this agent is bootstrapped through GitOps.
    Deliberately cluster-agnostic: environment, infrastructure and the in-cluster delegate are runtime inputs for BOTH stages, so bootstrapping a second permanent cluster (the gitops-demo k3d hub, environment Dev) is selecting a different Infrastructure plus the Service Overrides that give that hub its own agent identity - not cloning this pipeline.
  tags:
    purpose: platform-cd
    tier: bootstrap-0
  variables:
    - name: image_tag
      type: String
      description: Published controller image tag on Docker Hub — a commit SHA from main CI or a promoted semantic tag. Decoupled from chart_ref because chart and image do not publish from the same merge.
      required: true
      value: <+input>
    - name: deploy_agent
      type: String
      description: Set false to install only the controller — useful when recovering a cluster whose agent is already registered.
      required: true
      value: <+input>.default(true).allowedValues(true,false)
    - name: delegate_selector
      type: String
      description: Tag of the delegate running INSIDE the target cluster. The verify step is pinned to it because a ShellScript step does not inherit the infrastructure connector's delegate (B13).
      required: true
      value: <+input>.default(eks-delegate).allowedValues(eks-delegate,gitops-demo-delegate)
  stages:
    - stage:
        name: Deploy Controller
        identifier: deploy_controller
        description: Install or upgrade the HGA controller in hga-system. Also installs the HarnessGitopsAgent CRD and creates the platform-owned API-key Secret the controller reads for every agent.
        type: Deployment
        spec:
          deploymentType: NativeHelm
          service:
            serviceRef: hub_controller
            serviceInputs:
              serviceDefinition:
                type: NativeHelm
                spec:
                  artifacts:
                    primary:
                      primaryArtifactRef: controller_image
                      sources:
                        - identifier: controller_image
                          type: DockerRegistry
                          spec:
                            tag: <+pipeline.variables.image_tag>
          environment:
            environmentRef: <+input>
            deployToAll: false
            environmentInputs: <+input>
            serviceOverrideInputs: <+input>
            infrastructureDefinitions: <+input>
          execution:
            steps:
              - step:
                  type: HelmDeploy
                  name: Deploy Controller with Helm
                  identifier: deploy_controller_with_helm
                  spec:
                    skipDryRun: false
                    skipSteadyStateCheck: false
                    useUpgradeInstall: true
                    commandFlags:
                      - commandType: Install
                        flag: "--create-namespace --wait --timeout 5m"
                      - commandType: Upgrade
                        flag: "--create-namespace --wait --timeout 5m"
                  timeout: 10m
            rollbackSteps:
              - step:
                  type: HelmRollback
                  name: Roll Back Controller
                  identifier: rollback_controller
                  spec: {}
                  timeout: 10m
        tags: {}
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: StageRollback
    - stage:
        name: Deploy Account Agent
        identifier: deploy_account_agent
        description: |-
          Install or upgrade the day-0 ACCOUNT-scoped agent. The bootstrap chart creates the HarnessGitopsAgent CR, the controller registers it with Harness and writes the token Secret, and the gitops-helm runtime consumes that Secret.
          Environment and infrastructure are runtime inputs (they used to be pinned to hub / accountadminagent). A non-EKS hub MUST come with a Service Override on hub_account_agent for that environment/infrastructure that changes agent_identifier, agent_name and token_secret and adds its values override file (values/gitops-demo-agent-override.yaml) - otherwise the install registers a second agent under the EKS hub's identifier.
        type: Deployment
        when:
          pipelineStatus: Success
          condition: <+pipeline.variables.deploy_agent> == "true"
        spec:
          deploymentType: NativeHelm
          service:
            serviceRef: hub_account_agent
          environment:
            environmentRef: <+input>
            deployToAll: false
            environmentInputs: <+input>
            serviceOverrideInputs: <+input>
            infrastructureDefinitions: <+input>
          execution:
            steps:
              - step:
                  type: HelmDeploy
                  name: Deploy Agent with Helm
                  identifier: deploy_agent_with_helm
                  spec:
                    skipDryRun: false
                    skipSteadyStateCheck: false
                    useUpgradeInstall: true
                    commandFlags:
                      - commandType: Install
                        flag: "--create-namespace --wait --timeout 10m"
                      - commandType: Upgrade
                        flag: "--create-namespace --wait --timeout 10m"
                  timeout: 15m
              - step:
                  type: ShellScript
                  name: Verify Agent Registration
                  identifier: verify_agent_registration
                  description: |-
                    Helm reporting success only means the pods are steady. It says nothing about whether the controller actually registered the agent with Harness or recorded its project mapping — the two things this stage exists to achieve. Without this step a half-registered agent looks like a green pipeline.
                    Waits for status.agentIdentifier on the HarnessGitopsAgent, then for condition Ready on every HarnessGitopsProjectMapping in the namespace (the condition the installed controller actually emits; the former MappingReady wait never returned). Prints the agent's conditions either way so a failure is diagnosable from the log.
                    Requires the delegate's service account to be able to read HarnessGitopsAgent / HarnessGitopsProjectMapping resources; if it cannot, this fails with a Forbidden rather than a timeout, which is the useful error.
                  spec:
                    shell: Bash
                    onDelegate: true
                    delegateSelectors:
                      - <+pipeline.variables.delegate_selector>
                    source:
                      type: Inline
                      spec:
                        script: |-
                          set -euo pipefail

                          echo "waiting for the controller to register the agent..."
                          for i in $(seq 1 30); do
                            AGENT_ID=$(kubectl -n "$NS" get harnessgitopsagent "$NAME" \
                              -o jsonpath='{.status.agentIdentifier}' 2>/dev/null || true)
                            [ -n "$AGENT_ID" ] && break
                            sleep 10
                          done

                          if [ -z "${AGENT_ID:-}" ]; then
                            echo "FAILED: status.agentIdentifier never populated."
                            kubectl -n "$NS" get harnessgitopsagent "$NAME" -o yaml || true
                            exit 1
                          fi
                          echo "registered as: $AGENT_ID"
                          echo "agent conditions:"
                          kubectl -n "$NS" get harnessgitopsagent "$NAME" \
                            -o jsonpath='{range .status.conditions[*]}{.type}={.status} ({.reason}){"\n"}{end}' || true

                          echo "waiting for every project mapping in $NS to become Ready..."
                          if ! kubectl -n "$NS" wait harnessgitopsprojectmapping --all \
                               --for=condition=Ready --timeout=5m; then
                            echo "FAILED: a HarnessGitopsProjectMapping never became Ready. Conditions:"
                            kubectl -n "$NS" get harnessgitopsprojectmapping \
                              -o jsonpath='{range .items[*]}{.metadata.name}: {range .status.conditions[*]}{.type}={.status} ({.reason}) {end}{"\n"}{end}' || true
                            echo "AgentNotHealthy means the runtime is not CONNECTED in Harness; MappingVerificationFailed means it connected but the mapping did not verify."
                            exit 1
                          fi
                          echo "agent registered and all mappings verified."
                    environmentVariables:
                      - name: NS
                        type: String
                        value: <+infra.namespace>
                      - name: NAME
                        type: String
                        value: <+serviceVariables.agent_name>
                    outputVariables:
                      - name: AGENT_ID
                        type: String
                        value: AGENT_ID
                  timeout: 12m
            rollbackSteps:
              - step:
                  type: HelmRollback
                  name: Roll Back Agent
                  identifier: rollback_agent
                  spec: {}
                  timeout: 10m
        tags: {}
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: StageRollback
  allowStageExecutions: true
