# Grafana dashboard for the HGA controller (I25 consumer).
#
# ConfigMap-provisioned on purpose: Grafana persistence is OFF (see
# monitoring.yaml) so ConfigMap dashboards are the only kind that survive a
# restart. The kube-prometheus-stack Grafana sidecar picks up any ConfigMap
# labelled grafana_dashboard: "1" in its own namespace.
#
# Row 2 reads hga_mapping_ready / hga_mapping_info from the kube-state-metrics
# CustomResourceState config in monitoring.yaml — the only signal that sees an
# invalid spec (terminal errors land on CR status; reconcile result stays
# "success"). Row 1 charts the error RATE, never the cumulative counter: the
# hub carries a permanent benign errors_total=1 from a deploy-window status
# conflict (I28).
#
# NOTE: unlike monitoring.yaml (an ApplicationSet over hub clusters), this is a
# raw manifest — it lands only on the cluster the root Application syncs. If a
# second permanent hub ever appears, fold this into an ApplicationSet too.
apiVersion: v1
kind: ConfigMap
metadata:
  name: hga-controller-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  hga-controller.json: |
    {
      "uid": "hga-controller",
      "title": "HGA Controller",
      "tags": [
        "hga",
        "controller"
      ],
      "timezone": "browser",
      "editable": true,
      "graphTooltip": 1,
      "refresh": "1m",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "schemaVersion": 39,
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Alive",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Controller scrape",
          "description": "Prometheus `up` for the controller metrics target.",
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 0,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "1": {
                      "text": "UP",
                      "color": "#0ca30c"
                    },
                    "0": {
                      "text": "DOWN",
                      "color": "#d03b3b"
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#d03b3b",
                    "value": null
                  },
                  {
                    "color": "#0ca30c",
                    "value": 1
                  }
                ]
              },
              "noValue": "no target"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max(up{namespace=\"hga-system\", job=~\".*harness-gitops-agent-controller-metrics\"})",
              "instant": true,
              "range": false
            }
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Reconcile success rate (1h)",
          "description": "1 - errors/total over the last hour. Idle (no reconciles) shows as Idle, not as a failure.",
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 4,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "decimals": 1,
              "min": 0,
              "max": 100,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#d03b3b",
                    "value": null
                  },
                  {
                    "color": "#fab219",
                    "value": 90
                  },
                  {
                    "color": "#0ca30c",
                    "value": 99
                  }
                ]
              },
              "noValue": "Idle"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "100 * (1 - (sum(rate(controller_runtime_reconcile_errors_total{namespace=\"hga-system\"}[1h])) / sum(rate(controller_runtime_reconcile_total{namespace=\"hga-system\"}[1h]))))",
              "instant": true,
              "range": false
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Reconcile error rate",
          "gridPos": {
            "h": 5,
            "w": 10,
            "x": 8,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 8,
                "showPoints": "never",
                "spanNulls": true
              },
              "color": {
                "mode": "palette-classic"
              },
              "unit": "ops",
              "min": 0
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "errors/s"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#d03b3b"
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(controller_runtime_reconcile_errors_total{namespace=\"hga-system\"}[5m]))",
              "legendFormat": "errors/s"
            }
          ],
          "description": "rate(), never the cumulative counter \u2014 the hub carries a permanent benign errors_total=1 from a deploy-window status conflict (I28)."
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Workqueue depth",
          "description": "CRs waiting for a reconcile worker. Non-zero for more than a moment means the single worker is falling behind.",
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 18,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "min": 0,
              "decimals": 0,
              "color": {
                "mode": "fixed",
                "fixedColor": "#3987e5"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#3987e5",
                    "value": null
                  }
                ]
              },
              "noValue": "0"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "none",
            "graphMode": "area",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(workqueue_depth{namespace=\"hga-system\", name=\"harnessgitopsagent\"})"
            }
          ]
        },
        {
          "id": 6,
          "type": "row",
          "title": "Mappings \u2014 the panel that sees invalid CRs",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 6
          },
          "panels": []
        },
        {
          "id": 7,
          "type": "stat",
          "title": "CRs not ready",
          "description": "hga_mapping_ready == 0 count. This sees invalid specs, which reconcile metrics structurally cannot (terminal errors land on status, result=\"success\").",
          "gridPos": {
            "h": 7,
            "w": 4,
            "x": 0,
            "y": 7
          },
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#0ca30c",
                    "value": null
                  },
                  {
                    "color": "#d03b3b",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count(hga_mapping_ready == 0) OR on() vector(0)",
              "instant": true,
              "range": false
            }
          ]
        },
        {
          "id": 8,
          "type": "table",
          "title": "Project mappings per CR",
          "description": "One row per HarnessGitopsAgent CR exporting a MappingReady condition (kube-state-metrics CustomResourceState, I25).",
          "gridPos": {
            "h": 7,
            "w": 20,
            "x": 4,
            "y": 7
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "left",
                "filterable": false
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Ready"
                },
                "properties": [
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                          "1": {
                            "text": "Ready",
                            "color": "#0ca30c"
                          },
                          "0": {
                            "text": "NOT READY",
                            "color": "#d03b3b"
                          }
                        }
                      }
                    ]
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-background",
                      "mode": "basic"
                    }
                  },
                  {
                    "id": "custom.width",
                    "value": 110
                  }
                ]
              }
            ]
          },
          "options": {
            "showHeader": true,
            "sortBy": [
              {
                "displayName": "Ready",
                "desc": false
              }
            ]
          },
          "targets": [
            {
              "refId": "A",
              "expr": "hga_mapping_info * on(name, namespace) group_left hga_mapping_ready",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "__name__": true,
                  "container": true,
                  "customresource_group": true,
                  "customresource_kind": true,
                  "customresource_version": true,
                  "endpoint": true,
                  "instance": true,
                  "job": true,
                  "pod": true,
                  "service": true
                },
                "renameByName": {
                  "Value": "Ready",
                  "name": "CR name",
                  "namespace": "CR namespace",
                  "agent_identifier": "Agent",
                  "mapping_id": "Mapping ID",
                  "reason": "Reason"
                },
                "indexByName": {
                  "name": 0,
                  "namespace": 1,
                  "Value": 2,
                  "reason": 3,
                  "agent_identifier": 4,
                  "mapping_id": 5
                }
              }
            }
          ]
        },
        {
          "id": 9,
          "type": "row",
          "title": "Behavior",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 14
          },
          "panels": []
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "Reconcile duration",
          "gridPos": {
            "h": 7,
            "w": 8,
            "x": 0,
            "y": 15
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 8,
                "showPoints": "never",
                "spanNulls": true
              },
              "color": {
                "mode": "palette-classic"
              },
              "unit": "s",
              "min": 0
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "p50"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#3987e5"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "p99"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#d95926"
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.50, sum by (le) (rate(controller_runtime_reconcile_time_seconds_bucket{namespace=\"hga-system\"}[5m])))",
              "legendFormat": "p50"
            },
            {
              "refId": "B",
              "expr": "histogram_quantile(0.99, sum by (le) (rate(controller_runtime_reconcile_time_seconds_bucket{namespace=\"hga-system\"}[5m])))",
              "legendFormat": "p99"
            }
          ]
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "Workqueue wait p99",
          "gridPos": {
            "h": 7,
            "w": 8,
            "x": 8,
            "y": 15
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 8,
                "showPoints": "never",
                "spanNulls": true
              },
              "color": {
                "mode": "palette-classic"
              },
              "unit": "s",
              "min": 0
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "queue wait p99"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#3987e5"
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.99, sum by (le) (rate(workqueue_queue_duration_seconds_bucket{namespace=\"hga-system\", name=\"harnessgitopsagent\"}[5m])))",
              "legendFormat": "queue wait p99"
            }
          ],
          "description": "How long a CR sits queued before the single worker picks it up."
        },
        {
          "id": 12,
          "type": "timeseries",
          "title": "Reconcile results over time",
          "gridPos": {
            "h": 7,
            "w": 8,
            "x": 16,
            "y": 15
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 8,
                "showPoints": "never",
                "spanNulls": true
              },
              "color": {
                "mode": "palette-classic"
              },
              "unit": "ops",
              "min": 0
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "success"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#0ca30c"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "error"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#d03b3b"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "requeue"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#3987e5"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "requeue_after"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#d95926"
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (result) (rate(controller_runtime_reconcile_total{namespace=\"hga-system\"}[5m]))",
              "legendFormat": "{{result}}"
            }
          ]
        },
        {
          "id": 13,
          "type": "row",
          "title": "Cost",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 22
          },
          "panels": []
        },
        {
          "id": 14,
          "type": "timeseries",
          "title": "CPU vs limit",
          "gridPos": {
            "h": 7,
            "w": 8,
            "x": 0,
            "y": 23
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 8,
                "showPoints": "never",
                "spanNulls": true
              },
              "color": {
                "mode": "palette-classic"
              },
              "unit": "none",
              "min": 0
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "used"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#3987e5"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "limit"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#d03b3b"
                    }
                  },
                  {
                    "id": "custom.lineStyle",
                    "value": {
                      "fill": "dash",
                      "dash": [
                        10,
                        10
                      ]
                    }
                  },
                  {
                    "id": "custom.fillOpacity",
                    "value": 0
                  }
                ]
              }
            ]
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"hga-system\", container=\"manager\"}[5m]))",
              "legendFormat": "used"
            },
            {
              "refId": "B",
              "expr": "max(kube_pod_container_resource_limits{namespace=\"hga-system\", container=\"manager\", resource=\"cpu\"})",
              "legendFormat": "limit"
            }
          ],
          "description": "Cores. Limit is 500m from the chart values."
        },
        {
          "id": 15,
          "type": "timeseries",
          "title": "Memory vs limit",
          "gridPos": {
            "h": 7,
            "w": 8,
            "x": 8,
            "y": 23
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 8,
                "showPoints": "never",
                "spanNulls": true
              },
              "color": {
                "mode": "palette-classic"
              },
              "unit": "bytes",
              "min": 0
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "working set"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#3987e5"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "limit"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#d03b3b"
                    }
                  },
                  {
                    "id": "custom.lineStyle",
                    "value": {
                      "fill": "dash",
                      "dash": [
                        10,
                        10
                      ]
                    }
                  },
                  {
                    "id": "custom.fillOpacity",
                    "value": 0
                  }
                ]
              }
            ]
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(container_memory_working_set_bytes{namespace=\"hga-system\", container=\"manager\"})",
              "legendFormat": "working set"
            },
            {
              "refId": "B",
              "expr": "max(kube_pod_container_resource_limits{namespace=\"hga-system\", container=\"manager\", resource=\"memory\"})",
              "legendFormat": "limit"
            }
          ],
          "description": "Working set vs the 256Mi limit \u2014 OOM-kill distance."
        },
        {
          "id": 16,
          "type": "timeseries",
          "title": "Goroutines",
          "gridPos": {
            "h": 7,
            "w": 8,
            "x": 16,
            "y": 23
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 8,
                "showPoints": "never",
                "spanNulls": true
              },
              "color": {
                "mode": "palette-classic"
              },
              "min": 0
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "goroutines"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#199e70"
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(go_goroutines{namespace=\"hga-system\", job=~\".*harness-gitops-agent-controller-metrics\"})",
              "legendFormat": "goroutines"
            }
          ],
          "description": "A steady climb means a leak; the controller runs a single worker."
        }
      ],
      "templating": {
        "list": []
      },
      "annotations": {
        "list": []
      }
    }
