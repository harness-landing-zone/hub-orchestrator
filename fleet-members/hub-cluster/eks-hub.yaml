# EKS member of THIS hub.
#
# With a plugin source this file IS the chart's values file, so the keys here
# are exactly charts/fleet-members-registration/values.yaml.
#
# NAMING: clusterName is how THIS hub knows the cluster, and it must not be
# "hub-cluster" - that name and label already belong to this hub's own
# self-registration. On the EKS side the same cluster legitimately calls itself
# hub-cluster in its OWN Argo, because there it is a hub. Two Argo instances,
# two namespaces of meaning, no collision.
clusterName: eks-hub

# From `cluster_endpoint` output of the eks-hub workspace.
server: https://C942DA83313920F0BFB4D7AF438A0046.gr7.eu-west-2.eks.amazonaws.com

environment: np
tenant: control-plane

# MUST NOT be hub-cluster: this hub's root ApplicationSet selects that label and
# generates a STATICALLY named Application, so a second hub-labelled cluster
# produces two Applications with one name and halts the appset that bootstraps
# everything. The chart hard-fails the render if this is wrong.
fleetMember: spoke

project: default

credentials:
  enabled: true
  # Resolved by the ArgoCD Harness Plugin at manifest generation. Created by
  # terraform; base64 of the Argo cluster config JSON (caData + bearerToken).
  configB64: "<+secrets.getValue('eks_hub_cluster_config')>"

# ---------------------------------------------------------------------------
# Agent bootstrap - read by charts/harness-gitops-agent-bootstrap.
# The registration chart above ignores these keys and vice versa, so one file
# describes the whole member.
#
# Two alphabets, on purpose: metadata.name / harnessName must be DNS-safe
# (hyphens), while agentIdentifier is a HARNESS identifier (underscores). This
# hub's own agent shows the pattern: CR hub-account-agent -> hub_account_agent.
# ---------------------------------------------------------------------------
harnessAgent:
  enabled: true
  metadata:
    name: gitopsdemo-org-agent
  spec:
    name: gitopsdemo-org-agent
    scope: ORG
    apiKeySecretRef: gitopsdemo-api-key
    # MUST equal gitopsAgent.agent.existingSecrets.agentToken below - the chart
    # hard-fails otherwise. Leave them out of step and gitops-helm creates its
    # own Secret from a blank default: the agent runs with an empty token,
    # never connects, and the CR reports failure for entirely the wrong reason.
    tokenSecretRef: gitopsdemo-org-agent-token
  apiKeySecret:
    create: true
    # hga-system, NOT this release namespace: controller chart 0.8.0 resolves
    # an empty apiKeySecretNamespace to its OWN namespace. Keeping the key
    # there also means it survives deletion of the agent namespace, which the
    # finalizer needs to deregister the agent.
    namespace: hga-system
    value: "<+secrets.getValue('gitops-demo-admin')>"
    keep: true
  # Registers this monorepo in THIS member's own Argo CD, so the spoke can pull
  # its own folder. Same repo as the hub, different consumer.
  #
  # NOT githubAppJson: this file is plugin-rendered, and the plugin substitutes
  # into helm's OUTPUT - at template time the chart still sees the literal
  # expression, so fromJson dies with "not valid JSON". The individual fields
  # are passed through unparsed, so expressions survive to substitution.
  #
  # The two ids are literals ON PURPOSE. They are not credentials (both appear
  # in the GitHub App's own URL) and they land in stringData, which has no
  # base64 guard - an unresolved expression there is written verbatim and
  # surfaces as an opaque GitHub auth failure. Only the key is a secret, and it
  # lands in data: where an unresolved expression is rejected outright.
  gitSecret:
    create: true
    url: https://github.com/harness-landing-zone/hub-orchestrator.git
    project: default
    # Global repo-creds companion: ApplicationSet git generators resolve
    # credentials outside any AppProject, so without this they fetch the
    # private repo anonymously and fail.
    credsTemplate: true
    # QUOTED - an unquoted 7+ digit number renders in scientific notation and
    # silently produces a wrong credential. The chart hard-fails on non-strings.
    githubAppID: "2780955"
    githubAppInstallationID: "107783082"
    githubAppPrivateKeyB64: "<+secrets.getValue('github_app_private_key_b64')>"

gitopsAgent:
  enabled: true
  # PIN THE ARGO RUNTIME. gitops-helm 1.2.7 defaults to v2.14.9, whose bundled
  # OpenAPI schema predates .status.terminatingReplicas (a Kubernetes 1.33+
  # field on Deployment/ReplicaSet status). This cluster is Kubernetes 1.36, so
  # every structured merge diff against a live Deployment fails with
  #   error building typed value from live resource:
  #   .status.terminatingReplicas: field not declared in schema
  # and the Application never gets past comparison. It is not a sync failure and
  # retry does not clear it.
  #
  # v3.3.10 is what the homelab hub already runs against the same agent version
  # (v0.121.0), so this pairing is proven rather than assumed. Keep the two hubs
  # on the same Argo version deliberately - drifting apart is how this class of
  # bug reappears on whichever side is older.
  global:
    image:
      tag: v3.3.10
  harness:
    gitopsServerHost: https://app.harness.io/prod1/gitops
    identity:
      accountIdentifier: qIYsos1ZQO6fJMG1Ip6KJA
      # Required at ORG scope. projectIdentifier is deliberately absent - the
      # chart only requires it at PROJECT scope, and a non-empty value here
      # would contradict the agent's scope.
      orgIdentifier: gitopsdemo
      agentIdentifier: gitopsdemo_org_agent
    argocdHarnessPlugin:
      enabled: true
  agent:
    harnessName: gitopsdemo-org-agent
    existingSecrets:
      agentToken: gitopsdemo-org-agent-token
  argo-cd:
    crds:
      # This member has no Argo CD yet, so the runtime brings its own CRDs.
      install: true
      keep: true

# ---------------------------------------------------------------------------
# SELF-REGISTRATION - this cluster as a destination in its OWN Argo.
#
# THE DIVISION OF LABOUR, and the reason this block exists: the local hub's job
# is to install and REGISTER agents onto members - it ships the bundle and then
# stops. It does NOT go on to push every addon across the wire. Each member's
# own org-level Argo installs its own addons, which is what keeps the hub small
# and stops it becoming a single point of failure for the whole fleet.
#
# That only works if this cluster is a destination in its own Argo WITH
# metadata, because charts/application-sets reads everything it needs off a
# cluster Secret: repo coordinates from annotations, ladder position from
# labels. Without this Secret the clusters generator matches nothing and the
# whole thing reports "generated successfully" with ZERO Applications.
#
# NAME IS 'eks-hub', NOT THE CHART DEFAULT 'hub-cluster'. The valueFiles ladder
# keys its per-cluster rung on {{.name}}, so taking the default would resolve
# this cluster to addons/<tenant>/environments/<env>/clusters/HUB-CLUSTER/ -
# the exact folder the homelab hub uses, whose values are the opposite of what
# EKS needs (local-path vs EBS, kubeProxy disabled vs scrapeable). The
# fleet_member LABEL still says hub-cluster because that is the role the root
# ApplicationSet selects on. Role and identity are separate on purpose.
# ---------------------------------------------------------------------------
hubCluster:
  enabled: true
  name: eks-hub
  # It IS a hub in its own Argo - this is what rootAppSet.selector matches.
  fleetMember: hub-cluster
  labels:
    # Ladder rungs 1 and 2. These must match the labels the homelab hub already
    # stamps on ITS copy of this cluster (cluster-eks-hub), or the same cluster
    # would read two different ladder paths depending on which Argo asked.
    tenant: control-plane
    environment: np
    # The per-addon gate, applied because the monitoring wrapper sets
    # useSelectors: "true". Absent, kube-prometheus-stack simply never
    # generates - silently, with the appset still reporting success.
    enable_kube_prometheus_stack: "true"
  annotations:
    # READ BARE-FIELD by the chart ({{.metadata.annotations.addons_repo_url}}),
    # and missingkey=error makes any one of the three fatal to the ENTIRE
    # ApplicationSet - not to one Application. All three or none.
    #
    # basepath CANNOT be empty either: an empty value renders a double slash.
    addons_repo_url: https://github.com/harness-landing-zone/hub-orchestrator.git
    addons_repo_revision: main
    addons_repo_basepath: addons

# ---------------------------------------------------------------------------
# Root ApplicationSet for THIS member's own Argo: stamps one root Application
# that syncs a flat folder of ApplicationSets from this monorepo.
#
# PATH IS eks-hub/bootstrap, DELIBERATELY NOT eks-hub/applications. That second
# folder holds four Applications that are already running and were applied by
# hand; pointing the root appset at it would silently take them under
# management as a side effect of enabling monitoring. A new folder keeps this
# change to exactly what it claims to be.
#
# NOT the hub's own bootstrap/ folder either - that one carries ingress-nginx,
# cert-manager and a monitoring appset sized to three homelab worker VMs.
# ---------------------------------------------------------------------------
rootAppSet:
  enabled: true
  name: eks-hub-application-sets
  selector:
    fleet_member: hub-cluster
  path: eks-hub/bootstrap
  targetRevision: main
  project: default
  # MUST be set here: this member is installed through an Argo Application
  # using the Harness plugin (HELM_ARGS), whose CMP runs a second Go template
  # pass and destroys the {{.name}} placeholder - see the chart's values.yaml.
  # Matches hubCluster.name above, which is the only cluster this hub's root
  # ApplicationSet can match.
  destinationName: eks-hub

# Maps this member's Argo AppProject to a Harness project, so Applications
# filed under it appear in that project's GitOps view.
#
# Deliberately NOT using appProject.enabled: that template still carries
# helm.sh/hook + hook-delete-policy: before-hook-creation (BUGS B15), and Argo
# translates helm hooks into sync hooks - so EVERY sync would delete and
# recreate the AppProject, and apps in it cannot be validated during the gap.
# The controller's mapping reconciler ensures the AppProject exists anyway, so
# a mapping entry alone gets us the object without the churn.
projectMappings:
  - name: platform-team
    appProject: default
    # ORG-scoped agent: projectId is required, and orgId must be omitted or
    # match the agent's own org.
    orgId: gitopsdemo
    projectId: platformteam
    autoCreateServiceEnv: false

# The Argo AppProject the mapping above points at. Mirrors what the local hub
# does in values/account-agent-day0.yaml.
#
# CAVEAT (BUGS B15): templates/appproject.yaml carries helm.sh/hook with
# hook-delete-policy: before-hook-creation. Argo translates helm hooks into
# sync hooks, so this object is DELETED AND RECREATED on every sync - not once
# per deploy as it is under Harness CD. Harmless while nothing is filed under
# the project; once Applications live here, each sync opens a window where they
# cannot be validated. Proper fix is to drop the hook in the fork and let Argo
# manage it as an ordinary resource, but that chart is shared with the hub's
# day-0 so it needs its own change.
appProject:
  enabled: true
  name: default
  description: Default AppProject for the eks-hub member, mapped to gitopsdemo/platformteam
