# EKS member of THIS hub.
#
# With a plugin source this file IS the chart's values file, so the keys here
# are exactly charts/fleet-members-registration/values.yaml.
#
# NAMING: clusterName is how THIS hub knows the cluster, and it must not be
# "hub-cluster" - that name and label already belong to this hub's own
# self-registration. On the EKS side the same cluster legitimately calls itself
# hub-cluster in its OWN Argo, because there it is a hub. Two Argo instances,
# two namespaces of meaning, no collision.
clusterName: eks-hub

# From `cluster_endpoint` output of the eks-hub workspace.
server: https://C942DA83313920F0BFB4D7AF438A0046.gr7.eu-west-2.eks.amazonaws.com

environment: np
tenant: control-plane

# MUST NOT be hub-cluster: this hub's root ApplicationSet selects that label and
# generates a STATICALLY named Application, so a second hub-labelled cluster
# produces two Applications with one name and halts the appset that bootstraps
# everything. The chart hard-fails the render if this is wrong.
fleetMember: spoke

project: default

credentials:
  enabled: true
  # Resolved by the ArgoCD Harness Plugin at manifest generation. Created by
  # terraform; base64 of the Argo cluster config JSON (caData + bearerToken).
  configB64: "<+secrets.getValue('eks_hub_cluster_config')>"

# ---------------------------------------------------------------------------
# Agent bootstrap - read by charts/harness-gitops-agent-bootstrap.
# The registration chart above ignores these keys and vice versa, so one file
# describes the whole member.
#
# Two alphabets, on purpose: metadata.name / harnessName must be DNS-safe
# (hyphens), while agentIdentifier is a HARNESS identifier (underscores). This
# hub's own agent shows the pattern: CR hub-account-agent -> hub_account_agent.
# ---------------------------------------------------------------------------
harnessAgent:
  enabled: true
  metadata:
    name: gitopsdemo-org-agent
  spec:
    name: gitopsdemo-org-agent
    scope: ORG
    apiKeySecretRef: gitopsdemo-api-key
    # MUST equal gitopsAgent.agent.existingSecrets.agentToken below - the chart
    # hard-fails otherwise. Leave them out of step and gitops-helm creates its
    # own Secret from a blank default: the agent runs with an empty token,
    # never connects, and the CR reports failure for entirely the wrong reason.
    tokenSecretRef: gitopsdemo-org-agent-token
  apiKeySecret:
    create: true
    # hga-system, NOT this release namespace: controller chart 0.8.0 resolves
    # an empty apiKeySecretNamespace to its OWN namespace. Keeping the key
    # there also means it survives deletion of the agent namespace, which the
    # finalizer needs to deregister the agent.
    namespace: hga-system
    value: "<+secrets.getValue('gitops-demo-admin')>"
    keep: true

gitopsAgent:
  enabled: true
  harness:
    gitopsServerHost: https://app.harness.io/prod1/gitops
    identity:
      accountIdentifier: qIYsos1ZQO6fJMG1Ip6KJA
      # Required at ORG scope. projectIdentifier is deliberately absent - the
      # chart only requires it at PROJECT scope, and a non-empty value here
      # would contradict the agent's scope.
      orgIdentifier: gitopsdemo
      agentIdentifier: gitopsdemo_org_agent
    argocdHarnessPlugin:
      enabled: true
  agent:
    harnessName: gitopsdemo-org-agent
    existingSecrets:
      agentToken: gitopsdemo-org-agent-token
  argo-cd:
    crds:
      # This member has no Argo CD yet, so the runtime brings its own CRDs.
      install: true
      keep: true

# Maps this member's Argo AppProject to a Harness project, so Applications
# filed under it appear in that project's GitOps view.
#
# Deliberately NOT using appProject.enabled: that template still carries
# helm.sh/hook + hook-delete-policy: before-hook-creation (BUGS B15), and Argo
# translates helm hooks into sync hooks - so EVERY sync would delete and
# recreate the AppProject, and apps in it cannot be validated during the gap.
# The controller's mapping reconciler ensures the AppProject exists anyway, so
# a mapping entry alone gets us the object without the churn.
projectMappings:
  - name: platform-team
    appProject: default
    # ORG-scoped agent: projectId is required, and orgId must be omitted or
    # match the agent's own org.
    orgId: gitopsdemo
    projectId: platformteam
    autoCreateServiceEnv: false

# The Argo AppProject the mapping above points at. Mirrors what the local hub
# does in values/account-agent-day0.yaml.
#
# CAVEAT (BUGS B15): templates/appproject.yaml carries helm.sh/hook with
# hook-delete-policy: before-hook-creation. Argo translates helm hooks into
# sync hooks, so this object is DELETED AND RECREATED on every sync - not once
# per deploy as it is under Harness CD. Harmless while nothing is filed under
# the project; once Applications live here, each sync opens a window where they
# cannot be validated. Proper fix is to drop the hook in the fork and let Argo
# manage it as an ordinary resource, but that chart is shared with the hub's
# day-0 so it needs its own change.
appProject:
  enabled: true
  name: default
  description: Default AppProject for the eks-hub member, mapped to gitopsdemo/platformteam
