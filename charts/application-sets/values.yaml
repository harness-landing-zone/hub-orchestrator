# Common labels to be applied to all ApplicationSet-generated Applications and resources
globalValuesObject:
  commonLabels:
    app.kubernetes.io/part-of: "eks-fleet-management"
    managed-by: "gitops-fleet-management"
    team: "platform"
  commonAnnotations:
    managed-by: "gitops-fleet-management"

syncPolicy:
  automated:
    selfHeal: false
    allowEmpty: true
    prune: false
  retry:
    limit: -1 # number of failed sync attempt retries; unlimited number of attempts if less than 0
    backoff:
      duration: 5s # the amount to back off. Default unit is seconds, but could also be a duration (e.g. "2m", "1h")
      factor: 2 # a factor to multiply the base duration after each failed retry
      maxDuration: 10m # the maximum amount of time allowed for the backoff strategy
  syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true  # Big CRDs.
syncPolicyAppSet:
  preserveResourcesOnDeletion: true
ackPodIdentity:
  path: "charts/pod-identity"
# Name prefix for generated ApplicationSets AND the Applications they generate:
#   <releaseName>-<cluster>-<component>-<version>
#
# REQUIRED IN PRACTICE. Left empty the name template renders a LEADING HYPHEN
# ('-eks-hub-monitoring-87.19.2'), which is not a valid Kubernetes name, so
# every Application is rejected. There was no default before.
#
# It doubles as the collision guard for branch testing: rendering a branch with
# releaseName=test produces 'monitoring-test' ApplicationSets that cannot fight
# the 'monitoring-default' ones already running.
releaseName: default

# Which catalogue files under values/ to load. Each key must match a FILE NAME:
# mergeValues.monitoring.use=true reads values/monitoring.yaml.
#
# A name with no matching file renders NOTHING AT ALL, silently - a typo here
# costs you the whole group with no error. See templates/_validate.tpl, which
# turns that into a render failure.
mergeValues: {}

# If we Define the Merge we will use the values files included in the folder values. That will enable us to have default helm charts
#
# useSelectors "false" DROPS every component's own selector, so the per-addon
# enable_<addon> gate stops applying and each addon installs on every cluster
# globalSelectors matches. Set "true" whenever the catalogue uses enable_ gates.
useSelectors: "false"
# Only has an effect when a catalogue defines `releases:` (application-set.yaml
# line ~109). No catalogue here does, so this currently adds nothing. It becomes
# a silent no-match the day someone introduces release lanes without also
# labelling every cluster Secret with the matching <group>Release label.
useVersionSelectors: "true"

# The cluster selector applied to EVERY generated ApplicationSet.
#
# NEVER leave this empty. With no globalSelectors the selector degrades to
# `argocd.argoproj.io/secret-type: cluster` alone, which matches EVERY
# registered cluster - spokes and tenant instances included - and installs
# platform addons onto all of them. _validate.tpl refuses to render without it;
# set allowUnscopedSelector: true to override deliberately.
globalSelectors: {}
allowUnscopedSelector: false
# Default Values files that will apply to all applciationSets
repoURLGit: '{{.metadata.annotations.addons_repo_url}}'
repoURLGitRevision: '{{.metadata.annotations.addons_repo_revision}}'
repoURLGitBasePath: '{{.metadata.annotations.addons_repo_basepath}}'
valueFiles:
  - '{{if .metadata.labels.tenant}}{{.metadata.labels.tenant}}{{end}}/defaults'
  - '{{if .metadata.labels.tenant}}{{.metadata.labels.tenant}}{{end}}/environments/{{.metadata.labels.environment}}/defaults'
  - '{{if .metadata.labels.tenant}}{{.metadata.labels.tenant}}{{end}}/environments/{{.metadata.labels.environment}}/clusters/{{.name}}'
