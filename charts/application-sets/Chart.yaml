apiVersion: v2
name: application-sets
description: >-
  Generates one Argo CD ApplicationSet per ENABLED entry in a values catalogue,
  so a fleet addon becomes a values entry rather than a hand-written file.
  Catalogues live in values/ and are pulled in by name through mergeValues.
type: application

# ---------------------------------------------------------------------------
# VERSIONING - this is a FORK, and it owns its own lineage.
#
# Upstream is gitops-bridge-dev/gitops-bridge-helm-charts (charts/application-sets),
# which numbers its own releases 0.x. This copy has diverged materially:
# releaseName, globalValuesObject, templatePatch, applyNestedSelectors,
# ignoreApplicationDifferences, preservedFields, strategy, and an explicit
# tenant-aware valueFiles ladder replacing upstream's valuesFilePrefix.
#
# It previously carried version 0.3.3 - upstream's own number - which made
# "which code is this?" unanswerable from the chart alone, and would collide
# outright the moment upstream cut a 0.3.3 of its own. Starting at 1.0.0 makes
# our lineage unambiguous and sorts correctly against any upstream tag.
#
# BUMP THIS ON EVERY CHANGE, including edits under values/. Those files are
# compiled into the chart through $.Files.Get, so a catalogue edit changes what
# renders just as much as a template edit does.
# ---------------------------------------------------------------------------
version: 1.4.0

# The generator has no separate "application" to track, so appVersion mirrors
# the chart version. This is NOT cosmetic: _helpers.tpl stamps it as
# app.kubernetes.io/version on every ApplicationSet AND on every Application
# they generate. It previously read "1.16.0" - the `helm create` default -
# labelling the entire fleet with a version that never existed.
appVersion: "1.4.0"

keywords:
  - argo-cd
  - applicationset
  - gitops
  - fleet

annotations:
  # Provenance, so the fork point stays recoverable without archaeology.
  upstream.chart: gitops-bridge-dev/gitops-bridge-helm-charts
  upstream.path: charts/application-sets
  upstream.baseVersion: "0.3.3"
