# Test values for globalValuesObject functionality.
#
# A FIXTURE HAS NO FLEET, so there is no sensible cluster selector to scope to.
# _validate.tpl refuses to render with an empty globalSelectors (it would match
# every registered cluster in a real install), which is correct there and wrong
# here — so this fixture opts out deliberately rather than the guard being
# weakened. Without this line the chart's own executable documentation does not
# execute.
allowUnscopedSelector: true

globalValuesObject:
  commonLabels:
    app.kubernetes.io/part-of: "eks-fleet-management"
    managed-by: "gitops-fleet-management"
    team: "platform"
    global-test: "true"
  commonAnnotations:
    managed-by: "gitops-fleet-management"
    global-annotation: "test-value"

# Enable merging from component files
mergeValues:
  test:
    use: true

# Test components to verify globalValuesObject merging in the values/test.yaml
# Common configuration
syncPolicy:
  automated:
    selfHeal: true
    allowEmpty: true
    prune: true

repoURLGit: "https://github.com/test/repo.git"
repoURLGitRevision: "main"
repoURLGitBasePath: ""
valueFiles:
  - "defaults"
  - "environments/test"
