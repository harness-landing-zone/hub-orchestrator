{{- /* Hub self-registration: an argocd secret-type=cluster Secret naming
THIS cluster as an Argo destination (replaces the anonymous in-cluster
entry) so it carries metadata - the fleet_member label the root
ApplicationSet's clusters generator selects on, plus free-form
labels/annotations. Deliberately a PLAIN resource, not a hook: helm patches
it in place across upgrades, so the destination the whole bootstrap tree
hangs off is never deleted/recreated. Name/server only - the in-cluster
server authenticates with the runtime's own service account, no
credentials. */}}
{{- $hub := (.Values).hubCluster }}
{{- if and $hub $hub.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ default "hub-cluster" $hub.name | quote }}
  namespace: {{ .Release.Namespace }}
  labels:
    argocd.argoproj.io/secret-type: cluster
    fleet_member: {{ default "hub-cluster" $hub.fleetMember | quote }}
    {{- include "harness-gitops-agent-bootstrap.labels" . | nindent 4 }}
    {{- with $hub.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with $hub.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  name: {{ default "hub-cluster" $hub.name | quote }}
  server: {{ default "https://kubernetes.default.svc" $hub.server | quote }}
{{- end }}
