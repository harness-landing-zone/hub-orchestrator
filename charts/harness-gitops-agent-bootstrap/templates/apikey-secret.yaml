{{- if .Values.harnessAgent.apiKeySecret.create }}
{{- $value := required "harnessAgent.apiKeySecret.value is required when harnessAgent.apiKeySecret.create is true" .Values.harnessAgent.apiKeySecret.value -}}
{{- $name := required "harnessAgent.spec.apiKeySecretRef is required" .Values.harnessAgent.spec.apiKeySecretRef -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  # Controller chart 0.8.0 resolves an empty apiKeySecretNamespace to the
  # CONTROLLER release namespace, so the Secret must live there. Rendering
  # cross-namespace keeps day-0 single-shot; keep:true still protects it.
  namespace: {{ default .Release.Namespace .Values.harnessAgent.apiKeySecret.namespace }}
  labels:
    {{- include "harness-gitops-agent-bootstrap.labels" . | nindent 4 }}
  {{- if .Values.harnessAgent.apiKeySecret.keep }}
  annotations:
    # The controller finalizer reads this Secret to deregister the agent in
    # Harness during CR deletion; Helm must not remove it before the CR.
    helm.sh/resource-policy: keep
{{- end }}
type: Opaque
stringData:
  api_key: {{ $value | quote }}
{{- end }}
