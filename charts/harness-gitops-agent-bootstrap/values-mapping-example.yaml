# Map one Harness project to an AppProject on an existing shared ORG agent.
# Install this release in the shared agent's namespace. No agent runtime or
# token Secret is created, and deleting this release removes only the mappings
# it created - never the shared agent, and never a mapping it merely observed.

harnessAgent:
  metadata:
    name: example-project-mapping
  spec:
    name: example-project-mapping
    scope: ORG
    existingAgentIdentifier: shared_org_agent
    apiKeySecretRef: harness-api-key-secret

# Each entry is its own HarnessGitopsProjectMapping CR with independent
# conditions and retries. At ORG scope the org is inherited from the shared
# agent; each mapped project is stated per entry.
projectMappings:
  - name: example-project
    appProject: tenant-example-project
    projectId: example-project

appProject:
  enabled: true
  name: tenant-example-project
  description: Least-privilege AppProject for example-project
  sourceRepos:
    - https://github.com/example-org/example-project.git
  destinations:
    - namespace: example-project
      server: https://kubernetes.default.svc

gitopsAgent:
  # No runtime: the shared agent already runs elsewhere in this namespace.
  enabled: false
  harness:
    identity:
      accountIdentifier: your-account-id
      # Must match the shared agent's org so mapping validation can inherit it.
      orgIdentifier: example-org
      projectIdentifier: ""
      agentIdentifier: shared_org_agent
