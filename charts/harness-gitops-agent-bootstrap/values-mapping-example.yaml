# Map one Harness project to an AppProject on an existing shared ORG agent.
# Install this release in the shared agent's namespace. No agent runtime or
# token Secret is created, and deleting it never deregisters the shared agent.

harnessAgent:
  metadata:
    name: example-project-mapping
  spec:
    name: example-project-mapping
    scope: ORG
    existingAgentIdentifier: shared_org_agent
    apiKeySecretRef: harness-api-key-secret
    projectMapping:
      projectId: example-project
      AppProject: tenant-example-project

appProject:
  enabled: true
  name: tenant-example-project
  description: Least-privilege AppProject for example-project
  sourceRepos:
    - https://github.com/example-org/example-project.git
  destinations:
    - namespace: example-project
      server: https://kubernetes.default.svc
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
  orphanedResources:
    warn: true

gitopsAgent:
  enabled: false
  harness:
    identity:
      accountIdentifier: your-account-id
      orgIdentifier: your-org-id
      projectIdentifier: ""
      # This identifies the mapping CR. The shared agent itself is selected by
      # harnessAgent.spec.existingAgentIdentifier above.
      agentIdentifier: example_project_mapping
