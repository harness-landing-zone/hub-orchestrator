{{- if .Values.clusterName }}
{{- $name := .Values.clusterName -}}
{{- $server := required "server is required (the member's API endpoint)" .Values.server -}}
{{- if eq $.Values.fleetMember "hub-cluster" }}
{{- fail "fleetMember must not be hub-cluster - the root ApplicationSet selects that label and generates a STATICALLY named Application, so a second hub-labelled cluster collides and halts it" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "cluster-%s" $name | quote }}
  namespace: {{ .Release.Namespace }}
  labels:
    argocd.argoproj.io/secret-type: cluster
    fleet_member: {{ .Values.fleetMember | quote }}
    environment: {{ required "environment is required" .Values.environment | quote }}
    {{- with .Values.tenant }}
    tenant: {{ . | quote }}
    {{- end }}
    {{- with .Values.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    {{- /* Losing a destination strands every Application that targets it. */}}
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    {{- with .Values.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
type: Opaque
stringData:
  name: {{ $name | quote }}
  server: {{ $server | quote }}
  project: {{ .Values.project | default "default" | quote }}
{{- if .Values.credentials.enabled }}
data:
  {{- /* BASE64 in data:, NOT raw JSON in stringData:, and that choice is
  load-bearing twice over.

  1. The plugin substitutes textually into helm's OUTPUT. A raw config JSON
     carries double quotes, so substituting it into a quoted YAML scalar
     produces config: "{"tlsClientConfig":...}" - broken YAML. Base64 has no
     YAML-significant characters, so the substituted line always parses.
  2. Failure mode. If the expression is NOT resolved, this value is not valid
     base64, so the API server REJECTS the Secret and nothing lands. The
     alternative lands a cluster Secret holding an unresolved expression, and
     the ApplicationSet controller parses every cluster Secret when it lists
     clusters - one bad Secret stops ALL ApplicationSet reconciliation. That is
     the 2026-07-17 incident. Fail closed, not open. */}}
  config: {{ required "credentials.configB64 is required when credentials.enabled=true" .Values.credentials.configB64 | quote }}
{{- end }}
{{- else }}
{{- fail "clusterName is required (the member file's clusterName key)" }}
{{- end }}
