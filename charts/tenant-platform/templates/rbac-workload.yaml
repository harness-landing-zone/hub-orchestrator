{{- include "tenant-platform.validate" . -}}
{{- /*
WALL 1 - the real security boundary.

These are the ONLY permissions the tenant's Argo CD holds outside its own
namespace. There are no ClusterRoles anywhere for this tenant, by design:

  - a Role grants power only in its own namespace, and a RoleBinding is
    namespace-local even when it references cluster-admin;
  - cluster-wide power needs a ClusterRoleBinding, a cluster-scoped write no
    tenant identity holds;
  - Kubernetes escalation prevention means the tenant cannot author these Roles
    themselves - the platform must apply them. That is why this file is in the
    platform half.

application-controller gets full control WITHIN each workload namespace: it
applies whatever the tenant's manifests contain, and the namespace is the wall.
Narrow it with deployableKinds only if you also set resource.inclusions - see
values.yaml.

server gets read + logs + pod delete, which is what the UI resource tree, log
view and restart action need. Nothing more.
*/}}
{{- $top := . }}
{{- range .Values.workloadNamespaces }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $top.Values.team }}-argocd-application-controller
  namespace: {{ . | quote }}
  labels:
    {{- include "tenant-platform.labels" $top | nindent 4 }}
rules:
{{- if $top.Values.deployableKinds.enabled }}
  {{- toYaml $top.Values.deployableKinds.rules | nindent 2 }}
{{- else }}
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $top.Values.team }}-argocd-application-controller
  namespace: {{ . | quote }}
  labels:
    {{- include "tenant-platform.labels" $top | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $top.Values.team }}-argocd-application-controller
subjects:
  - kind: ServiceAccount
    name: argocd-application-controller
    namespace: {{ $top.Values.argocdNamespace | quote }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $top.Values.team }}-argocd-server
  namespace: {{ . | quote }}
  labels:
    {{- include "tenant-platform.labels" $top | nindent 4 }}
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # Pod delete is the UI "restart" action. It is not a general write verb.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete"]
{{- if $top.Values.rolloutActions.enabled }}
  # ROLLOUT ACTIONS - the one verb the read-only Role above cannot supply.
  #
  # Argo CD's resource actions for argoproj.io/Rollout (resume, promote-full,
  # abort, retry, restart - exactly the Harness GitOps Rollout step's
  # autoRolloutAction values) run in ARGOCD-SERVER, not in the
  # application-controller: RunResourceActionV2 executes the Lua action and then
  # patches the object using the DESTINATION cluster's rest.Config. Our
  # destination is the credential-less {{ $top.Values.team }}-in-cluster Secret,
  # so that config resolves to the in-cluster ServiceAccount of the process
  # running the code - argocd-server. status FIRST: patchResource attempts the
  # status subresource before the spec.
  #
  # The asymmetry is what makes this expensive to diagnose. Every rollout WAIT
  # succeeds without it (waits read the application-controller's cached resource
  # tree), so a pipeline gets all the way to Suspended/CanaryPauseStep and only
  # then 403s on resume.
  #
  # patch is the whole delta - get is already covered by the wildcard read rule
  # above and is repeated only so the grant reads as one intent. This stays
  # strictly less than the application-controller Role beside it already holds
  # in the same namespace ('*'/'*'/'*'): one API group, one resource plus its
  # status subresource, no new namespace, nothing cluster-scoped. WALLS 1, 2 and
  # 4 are unmoved.
  #
  # The rollouts CONTROLLER and its cluster-scoped CRDs are NOT installed here -
  # they are a platform-tier addon, ../../applications/argo-rollouts.yaml.
  - apiGroups: ["argoproj.io"]
    resources: ["rollouts", "rollouts/status"]
    verbs: ["get", "patch"]
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $top.Values.team }}-argocd-server
  namespace: {{ . | quote }}
  labels:
    {{- include "tenant-platform.labels" $top | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $top.Values.team }}-argocd-server
subjects:
  - kind: ServiceAccount
    name: argocd-server
    namespace: {{ $top.Values.argocdNamespace | quote }}
---
{{- /*
THE HARNESS AGENT IS A THIRD IDENTITY, and missing it is the single most
expensive class of bug on this hub.

The two Roles above are the UPSTREAM ARGO answer: argocd-server runs the UI's
reads, logs and resource actions, the application-controller applies manifests.
Both are correct, and both are irrelevant when the request arrives from Harness.

Harness proxies through the AGENT, so every Harness-originated request against a
workload namespace authenticates as
  system:serviceaccount:<argocdNamespace>:<agentServiceAccount>
which holds nothing here unless this Role grants it. Two failures already paid
for, and they look nothing alike:

  - Log pane empty for any tenant workload, no error surfaced anywhere:
        pods "podinfo-..." is forbidden: User
        "system:serviceaccount:team1-argo:gitops-agent" cannot get resource
        "pods/log" in ... namespace "team1-dev"
    Cost two diagnostic rounds - the crashing image's config had to be read from
    the container registry because the logs were unreachable.

  - GitOps Rollout step dies at the first canary pause:
        failed to get rollouts resource from argo: ... rollouts.argoproj.io
        "podinfo" is forbidden: User
        "system:serviceaccount:team1-argo:gitops-agent" cannot get resource
        "rollouts" in API group "argoproj.io" in the namespace "team1-prod"
    Note this is a GET, not the patch that rolloutActions above anticipates. The
    argocd-server grant does not help: that path is Argo's own resource actions,
    a different caller entirely.

Deliberately NOT a copy of the argocd-server Role. That one opens '*'/'*' read
across the namespace; this grants only what Harness has been observed to need,
so a new Harness capability shows up as a clean 403 naming its own resource
rather than silently working through an over-broad grant. If a future step needs
list/watch on rollouts, add it here - the 403 will say so.

Still strictly inside WALL 1: namespace-scoped Roles only, no ClusterRole, no
new namespace, and less power than the application-controller already holds
beside it.

SUPERSEDED BY I22 when the controller reconciles per-namespace RBAC from a
managed-by label. Keep this shaped as "one Role per identity per workload
namespace" so I22 can absorb it wholesale.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $top.Values.team }}-gitops-agent
  namespace: {{ . | quote }}
  labels:
    {{- include "tenant-platform.labels" $top | nindent 4 }}
rules:
  # Harness routes log requests through the agent, not through argocd-server.
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
{{- if $top.Values.rolloutActions.enabled }}
  # get: the GitOps Rollout step reads Rollout status before every action.
  # patch: resume / promote-full / abort / retry / restart.
  - apiGroups: ["argoproj.io"]
    resources: ["rollouts", "rollouts/status"]
    verbs: ["get", "patch"]
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $top.Values.team }}-gitops-agent
  namespace: {{ . | quote }}
  labels:
    {{- include "tenant-platform.labels" $top | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $top.Values.team }}-gitops-agent
subjects:
  - kind: ServiceAccount
    name: {{ $top.Values.agentServiceAccount | quote }}
    namespace: {{ $top.Values.argocdNamespace | quote }}
---
{{- end }}
