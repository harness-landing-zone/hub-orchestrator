{{- range $name, $cfg := .Values.externalSecrets }}
{{- if $cfg.enabled }}
{{- $ns := required (printf "externalSecrets.%s.namespace is required" $name) $cfg.namespace }}
{{- $remoteKey := required (printf "externalSecrets.%s.remoteKey is required" $name) $cfg.remoteKey }}
{{- $store := $.Values.secretStore }}
{{- if not $store.name }}
{{- fail (printf "externalSecrets.%s needs secretStore.name to reference" $name) }}
{{- end }}
{{- if not $cfg.data }}
{{- fail (printf "externalSecrets.%s.data is required - an ExternalSecret with no data produces an EMPTY Secret and the consuming workload starts with blank credentials rather than failing" $name) }}
{{- end }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
spec:
  refreshInterval: {{ default "1h" $.Values.refreshInterval }}
  secretStoreRef:
    name: {{ $store.name }}
    kind: {{ default "ClusterSecretStore" $store.kind }}
  target:
    name: {{ default $name $cfg.targetName }}
    creationPolicy: Owner
    {{- /* Retain: deleting the ExternalSecret must not pull the credential out
    from under a running workload. */}}
    deletionPolicy: Retain
    {{- with $cfg.literals }}
    {{- /* mergePolicy Merge puts non-secret literals in the SAME Secret as the
    fetched values WITHOUT templating the fetched value itself. Templating it
    would mean escaping {{ }} through helm into ESO's own engine - the
    double-templating that produced '<no value>' elsewhere in this repo. */}}
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
        {{- range $k, $v := . }}
        {{ $k }}: {{ $v | quote }}
        {{- end }}
    {{- end }}
  data:
    {{- range $cfg.data }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ $remoteKey | quote }}
        property: {{ .property | default .secretKey }}
        {{- /* SET EXPLICITLY EVEN THOUGH THEY ARE THE CRD DEFAULTS.
        Omit them and the API server defaults them in, so the live object gains
        three fields the rendered manifest does not have. Argo then reports the
        ExternalSecret OutOfSync FOREVER - every sync "succeeds", the diff never
        closes, and the Application can never reach Synced.
        This is why the prior-art fleet-secret chart writes them out too; it
        reads as noise until you have chased the drift once. */}}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    {{- end }}
{{- end }}
{{- end }}
