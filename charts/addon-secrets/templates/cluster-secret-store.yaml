{{- if .Values.secretStore.enabled }}
{{- if not .Values.secretStore.region }}
{{- fail "secretStore.region is required when secretStore.enabled=true - an empty region makes every fetch fail with an opaque AWS SDK error rather than a config error" }}
{{- end }}
{{- /* API version verified against the CRDs installed by external-secrets
2.8.0: clustersecretstores.external-secrets.io serves v1 (NOT v1beta1, which
older examples still show). */}}
apiVersion: external-secrets.io/v1
kind: {{ .Values.secretStore.kind }}
metadata:
  name: {{ .Values.secretStore.name }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.secretStore.region }}
      {{- /* No auth block and no role, deliberately. EKS Pod Identity gives the
      external-secrets controller pod its credentials at start, so ESO picks
      them up from the default AWS credential chain. Adding `role:` here makes
      ESO try to assume a role on top of an identity that is already correct. */}}
{{- end }}
