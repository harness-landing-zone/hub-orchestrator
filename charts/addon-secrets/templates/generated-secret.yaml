{{- range $name, $cfg := .Values.generatedSecrets }}
{{- if $cfg.enabled }}
{{- $ns := required (printf "generatedSecrets.%s.namespace is required" $name) $cfg.namespace }}
{{- $remoteKey := required (printf "generatedSecrets.%s.remoteKey is required" $name) $cfg.remoteKey }}
{{- $passwordKey := default "password" $cfg.passwordKey }}
{{- $target := default $name $cfg.targetName }}
{{- $store := $.Values.secretStore }}
{{- if not $store.name }}
{{- fail (printf "generatedSecrets.%s needs secretStore.name - the consuming ExternalSecret and the PushSecret both reference it" $name) }}
{{- end }}
---
{{- /* 1. GENERATOR. Produces a random value under the key `password`.
Namespaced, so it must live where the seed ExternalSecret does. */}}
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: {{ $name }}-generator
  namespace: {{ $ns }}
spec:
  length: {{ default 24 $cfg.length }}
  digits: {{ default 5 $cfg.digits }}
  {{- /* Symbols default to ZERO on purpose. A Grafana admin password ends up
  pasted into URLs, kubectl one-liners and CI variables; punctuation there is a
  quoting bug waiting to happen, and length buys more entropy than symbols do. */}}
  symbols: {{ default 0 $cfg.symbols }}
  noUpper: false
  allowRepeat: true
---
{{- /* 2. SEED. refreshInterval "0" means generate ONCE and never again - with
any other value the generator would mint a new password on every refresh, which
is the exact churn this chart exists to stop.

deletionPolicy Retain so a re-render cannot destroy the seed before the
PushSecret has had a chance to publish it. */}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}-seed
  namespace: {{ $ns }}
spec:
  refreshInterval: "0"
  target:
    name: {{ $name }}-seed
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ $name }}-generator
---
{{- /* 3. PUSH. updatePolicy IfNotExists is THE load-bearing setting.
On a cluster rebuild the seed above regenerates a different value; IfNotExists
means AWS is not overwritten, so the consuming ExternalSecret below reads the
ORIGINAL password back and the credential survives. Set this to Replace and the
password silently changes on every rebuild - the failure this chart prevents.

deletionPolicy None: deleting the PushSecret must not delete the credential in
AWS. Recovering from that would mean everyone's stored password is wrong.

PushSecret is served at v1alpha1 by external-secrets 2.8.0 - verified against
the installed CRD, not assumed. It is the one resource here that is NOT v1. */}}
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: {{ $name }}-push
  namespace: {{ $ns }}
spec:
  refreshInterval: {{ default "1h" $.Values.refreshInterval }}
  updatePolicy: IfNotExists
  deletionPolicy: None
  secretStoreRefs:
    - name: {{ $store.name }}
      kind: {{ default "ClusterSecretStore" $store.kind }}
  selector:
    secret:
      name: {{ $name }}-seed
  data:
    - match:
        secretKey: password
        remoteRef:
          remoteKey: {{ $remoteKey | quote }}
          property: {{ $passwordKey }}
---
{{- /* 4. CONSUME. This is the Secret the addon actually mounts - for Grafana,
what grafana.admin.existingSecret points at. It reads AWS, never the generator,
which is what makes Secrets Manager the source of truth.

mergePolicy Merge lets the non-secret literals (admin-user) sit in the same
Secret as the fetched password WITHOUT any ESO templating of the secret value.
That matters: templating a fetched value would need {{ }} escaped through helm
into ESO's own engine, and that double-templating is exactly the class of bug
that produced '<no value>' elsewhere in this repo. */}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
spec:
  refreshInterval: {{ default "1h" $.Values.refreshInterval }}
  secretStoreRef:
    name: {{ $store.name }}
    kind: {{ default "ClusterSecretStore" $store.kind }}
  target:
    name: {{ $target }}
    creationPolicy: Owner
    deletionPolicy: Retain
    {{- with $cfg.literals }}
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
        {{- range $k, $v := . }}
        {{ $k }}: {{ $v | quote }}
        {{- end }}
    {{- end }}
  data:
    - secretKey: {{ $passwordKey }}
      remoteRef:
        key: {{ $remoteKey | quote }}
        property: {{ $passwordKey }}
{{- end }}
{{- end }}
