# ============================================================================
# addon-secrets
#
# A ClusterSecretStore, plus per-addon ExternalSecrets that READ credentials
# from AWS Secrets Manager. Nothing more.
#
# READ-ONLY BY DESIGN - WHERE THE BOUNDARY SITS
# ----------------------------------------------
# This chart consumes credentials. It does not create them. Whatever owns the
# AWS account owns a secret's lifecycle: terraform today, alongside the IAM and
# Pod Identity it already manages for this cluster; ACK (AWS Controllers for
# Kubernetes) later if secret provisioning should move in-cluster.
#
# That split is the point. Creating an AWS resource and consuming it are
# different jobs with different blast radii, and putting both in one chart
# means every cluster that merely READS a credential also carries permission to
# WRITE it.
#
# WHAT A NEW CLUSTER THEREFORE NEEDS: the Secrets Manager entry must exist
# before the consuming addon will go Healthy. Create it in the cluster's
# terraform lifecycle, or by hand for a one-off:
#
#   aws secretsmanager create-secret --name <cluster>/<addon>/<key> \
#     --region <region> --secret-string '{"<property>":"<value>"}'
#
# An earlier version generated the password in-cluster and published it with a
# PushSecret - four resources per credential, to avoid exactly that step. Worth
# knowing before anyone reinstates it: external-secrets v2.8.0 cannot create a
# Secrets Manager entry at all. Its CreateSecret call sends
# `AddReplicaRegions: []`, and AWS rejects empty arrays:
#
#   ValidationException: Value '[]' at 'addReplicaRegions' failed to satisfy
#   constraint: Member must have length greater than or equal to 1
#
# Nothing in the CRD surface populates or suppresses that field - checked both
# the ClusterSecretStore provider schema (only forceDeleteWithoutRecovery /
# recoveryWindowInDays) and the PushSecret remoteRef schema (only property /
# remoteKey). It affects CREATE only; once the entry exists, PutSecretValue
# works fine. So that design could never make the first write, which was the
# only write it existed to make.
# ============================================================================

# ---- ClusterSecretStore -----------------------------------------------------
# Cluster-scoped on purpose: consuming ExternalSecrets live in whichever
# namespace their addon does, and a namespaced SecretStore would need one copy
# per namespace.
#
# No `role:`. Authentication is EKS Pod Identity, associated to
# (external-secrets, external-secrets-sa) on the AWS side, so the controller
# already holds credentials from the default chain. Setting `role` makes ESO
# attempt an sts:AssumeRole it does not need.
secretStore:
  enabled: false
  kind: ClusterSecretStore
  name: aws-secrets-manager
  region: ""

# ---- Credentials read from Secrets Manager ---------------------------------
# A map so one release can own several.
#
# remoteKey follows the agreed convention <cluster>/<addon>/<key>, which sits
# inside the IAM scope terraform grants
# (arn:aws:secretsmanager:<region>:*:secret:<cluster>/*). A key outside that
# prefix fails AccessDenied, with nothing in the error mentioning paths.
#
# THE CLUSTER IN THAT PATH IS THE **AWS** CLUSTER NAME, which is not always the
# Argo destination name - on this fleet they differ (hub-cluster vs eks-hub).
externalSecrets: {}
# grafana-admin:
#   enabled: true
#   namespace: monitoring
#   # The Secret the addon mounts - what grafana.admin.existingSecret points at.
#   targetName: grafana-admin
#   remoteKey: "hub-cluster/grafana/admin"
#   # Keys to pull out of the remote secret. secretKey is the key in the
#   # produced Kubernetes Secret; property is the field inside the remote JSON.
#   data:
#     - secretKey: admin-password
#       property: admin-password
#   # Non-secret values merged in alongside. Grafana needs admin-user next to
#   # admin-password in the SAME Secret.
#   literals:
#     admin-user: admin

# How often to re-read Secrets Manager.
refreshInterval: 1h
