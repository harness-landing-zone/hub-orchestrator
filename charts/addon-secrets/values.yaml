# ============================================================================
# addon-secrets
#
# A ClusterSecretStore, plus per-addon ExternalSecrets that READ credentials
# from AWS Secrets Manager. Nothing more.
#
# WHY THIS IS READ-ONLY, having briefly not been
# ----------------------------------------------
# The first version generated the password in-cluster (Password generator ->
# seed ExternalSecret -> PushSecret -> consuming ExternalSecret), so the value
# never had to be created by hand. Four resources to avoid one manual step.
#
# It does not work: external-secrets v2.8.0 sends `AddReplicaRegions: []` on
# CreateSecret and AWS rejects empty arrays with
#
#   ValidationException: Value '[]' at 'addReplicaRegions' failed to satisfy
#   constraint: Member must have length greater than or equal to 1
#
# No CRD field suppresses it - checked both the ClusterSecretStore provider
# schema (only forceDeleteWithoutRecovery / recoveryWindowInDays) and the
# PushSecret remoteRef schema (only property / remoteKey). See BUGS B25.
#
# The bug only affects CREATE. Once the remote secret exists ESO uses
# PutSecretValue, which is fine. So the whole generate-and-push apparatus only
# ever bought the FIRST write - and it is the first write that is broken.
#
# Deleting it removes three resources per credential and one upstream defect
# from the critical path. The secret is created once, out of band; everything
# after that is a plain read. Restore generation only if ESO fixes CreateSecret
# AND the manual step is genuinely costing something.
# ============================================================================

# ---- ClusterSecretStore -----------------------------------------------------
# Cluster-scoped on purpose: consuming ExternalSecrets live in whichever
# namespace their addon does, and a namespaced SecretStore would need one copy
# per namespace.
#
# No `role:`. Authentication is EKS Pod Identity, associated to
# (external-secrets, external-secrets-sa) on the AWS side, so the controller
# already holds credentials from the default chain. Setting `role` makes ESO
# attempt an sts:AssumeRole it does not need.
secretStore:
  enabled: false
  kind: ClusterSecretStore
  name: aws-secrets-manager
  region: ""

# ---- Credentials read from Secrets Manager ---------------------------------
# A map so one release can own several.
#
# remoteKey follows the agreed convention <cluster>/<addon>/<key>, which sits
# inside the IAM scope terraform grants
# (arn:aws:secretsmanager:<region>:*:secret:<cluster>/*). A key outside that
# prefix fails AccessDenied, with nothing in the error mentioning paths.
#
# THE CLUSTER IN THAT PATH IS THE **AWS** CLUSTER NAME, which is not always the
# Argo destination name - on this fleet they differ (hub-cluster vs eks-hub).
externalSecrets: {}
# grafana-admin:
#   enabled: true
#   namespace: monitoring
#   # The Secret the addon mounts - what grafana.admin.existingSecret points at.
#   targetName: grafana-admin
#   remoteKey: "hub-cluster/grafana/admin"
#   # Keys to pull out of the remote secret. secretKey is the key in the
#   # produced Kubernetes Secret; property is the field inside the remote JSON.
#   data:
#     - secretKey: admin-password
#       property: admin-password
#   # Non-secret values merged in alongside. Grafana needs admin-user next to
#   # admin-password in the SAME Secret.
#   literals:
#     admin-user: admin

# How often to re-read Secrets Manager.
refreshInterval: 1h
